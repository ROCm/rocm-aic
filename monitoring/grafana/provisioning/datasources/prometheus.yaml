apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://aic-prometheus:9090
    isDefault: true
    jsonData:
      # The global scrape_interval in monitoring/prometheus/prometheus.yml.
      # Smaller, and $__rate_interval (4x this) spans a single sample.
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://aic-loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
