#
# Prometheus scrape config for the  metrics-capture sidecar.
#
# Prometheus runs on the `aic` Docker bridge network (see docker-compose.yml),
# so inference stack targets are reached by container name. This works for:
#   - `make up-monitoring`: all services on the aic network, names resolve via DNS
#   - `make monitoring-up` (legacy cliff sbatch path): prometheus runs on host
#     network; container-name targets won't resolve but localhost fallbacks below
#     handle that case via the monitoring/docker-compose.monitoring.yml config.
#
# nvme_exporter and rdma_exporter remain host-side services (or launched via
# the monitoring compose exporters-fabric profile); prometheus reaches them via
# host-gateway which resolves to the Docker host IP from within the aic network.
#
# Job names and ports mirror the batesste Ansible monitoring roles so the
# same Grafana dashboards / recording rules apply.  NIXL exposes its own (beta)
# Prometheus telemetry exporter on :19090 when the prometheus-cpp plugin is
# compiled into the image and NIXL_TELEMETRY_* is set on the LMCache process;
# its transfer counters also surface through the LMCache job on :8080.
#
# Targets that are absent for a given run simply show as `down` -- harmless.

global:
  scrape_interval: 15s       # lmcache /metrics can block under load; 15s prevents gaps
  scrape_timeout: 10s        # must be < scrape_interval; gives lmcache 10s to respond
  evaluation_interval: 15s
  external_labels:
    cluster: AIC

rule_files:
  - /etc/prometheus/rules/aic.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["aic-prometheus:9090"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["aic-vllm-gpu0:8000"]

  - job_name: lmcache
    metrics_path: /metrics
    static_configs:
      - targets: ["aic-lmcache:8080"]

  # LMCache coordinator exporter — polls the coordinator REST API (/instances,
  # /directory/stats, /quota) and emits Prometheus text format on :9301.
  # Exposes: lmcache_coordinator_up, _instances_registered, _directory_keys_total,
  # _directory_placements_total, _instance_l1_keys, _instance_seq_gap,
  # _quota_usage_bytes, _quota_limit_bytes, _scrape_duration_seconds.
  - job_name: lmcache_coordinator
    metrics_path: /metrics
    static_configs:
      - targets: ["aic-lmcache-coordinator:9301"]

  # NIXL native telemetry exporter (agent_tx_bytes_total, agent_errors_total,
  # ...). Present only when the prometheus-cpp plugin is built into the image and
  # NIXL_TELEMETRY_* is set on the LMCache process. Beta; metric names may change.
  - job_name: nixl
    metrics_path: /metrics
    static_configs:
      - targets: ["aic-lmcache:19090"]

  # node-exporter: CPU/mem/net + NVMe I/O (diskstats/nvme collectors) and
  # RDMA/InfiniBand port counters (infiniband collector).
  - job_name: node_exporter
    static_configs:
      - targets: ["aic-node-exporter:9100"]

  # Dedicated NVMe exporter (containerised in monitoring profile).
  - job_name: nvme_exporter
    static_configs:
      - targets: ["aic-nvme-exporter:9998"]

  # Dedicated RDMA exporter (containerised in monitoring profile; yuuki-style
  # rdma_port_rcv_data_total / rdma_port_xmit_data_total metrics).
  - job_name: rdma_exporter
    static_configs:
      - targets: ["aic-rdma-exporter:9879"]

  # AMD GPU device-metrics-exporter (gpu_* metrics).  Always on :5000 on aic-network.
  - job_name: amd_metrics_exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["aic-amdgpu-exporter:5000"]

  # hsa-snoop: HSA AQL queue/dispatch telemetry (hsa_kernel_launches_total,
  # hsa_kernel_duration_seconds, hsa_active_queues, hsa_snoop_up, ...) and AIS
  # (AMD Infinity Storage) P2P storage telemetry (ais_rx_ops_total,
  # ais_tx_ops_total, ais_rx_bytes_total, ais_tx_bytes_total,
  # ais_rx_errors_total, ais_tx_errors_total, ais_rx_latency_seconds,
  # ais_tx_latency_seconds, ais_rx_io_size_bytes, ais_tx_io_size_bytes) --
  # all metric families are served on the same :9488 endpoint; SDMA metrics
  # are available from v1.1.0.
  # hsa-snoop: host service (or monitoring compose exporters profile).
  # Reached via host-gateway since it holds tracefs exclusively on the host.
  - job_name: hsa_snoop
    metrics_path: /metrics
    static_configs:
      - targets: ["aic-hsa-snoop:9488"]
      # Fallback for host-network or standalone deployments
      - targets: ["host-gateway:9488"]
