#
# KV-integrity accuracy gate — scores gsm8k against both a VRAM-only arm and
# a tiered (LMCache + NIXL POSIX NVMe) arm, asserting that routing KV through
# DRAM/NVMe did not change the answers.
#
# Two triggers:
#   workflow_run  — nightly: fires after Smoke Test passes as part of the
#                   nightly chain:
#                     Dist Build -> Smoke -> [Tiny | Accuracy | Cliff]
#   workflow_dispatch — manual: dispatched against a SHA that already has an
#                   image tarball staged under AIC_CI_STORAGE_ROOT/images/
#                   aic-ci-<short-sha> (i.e. a dist-build ran for the same
#                   commit and kept its artifacts).
#
# There is also a PR path: aic-dist-build.yml's /run-ci-accuracy command
# chains accuracy-test as a fifth job after dist-build + smoke + tiny.
#
# The full gate — both arms, full gsm8k split — runs ~65 min.  There is no
# cheaper variant: the capped, baseline-less one that used to exist skipped
# the differential and so could only fail on catastrophe.  See
# tests/accuracy/README.md.
#
# Requires (all already in use by sibling hardware-CI workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch
#   secrets.AIC_SPUR_CONTROLLER  — SPUR controller address
#   secrets.AIC_HF_TOKEN         — HF token for the model download

name: rocm-aic - Self Hosted - Accuracy Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["rocm-aic - Self Hosted - Nightly Smoke Test"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hardware-ci-spur-${{ github.sha }}
  cancel-in-progress: false

jobs:
  accuracy-test:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, rocm-aic-cicd]
    # Both arms over the full 1319-item split: 58 min measured (SPUR job 6235)
    # plus ~7 min now that the restart phase is full-split too, so ~65 min.
    # 120 leaves ~1.8x headroom, and the sbatch job has its own 2h wall clock.
    timeout-minutes: 120
    env:
      AIC_SPUR_HOST:       ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:      ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_SPUR_CONTROLLER: ${{ secrets.AIC_SPUR_CONTROLLER }}
      HF_TOKEN:            ${{ secrets.AIC_HF_TOKEN }}

    steps:
      - name: Run accuracy-test on the SPUR head node
        run: |
          bash /usr/local/lib/aic-ci/spur-accuracy-test.sh \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            accuracy-test

      # if: always() — a failed gate is exactly when the per-phase scores and
      # per-arm container logs are worth having.
      - name: Upload accuracy logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: accuracy-logs-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/accuracy-logs/
          if-no-files-found: warn
          retention-days: 14
