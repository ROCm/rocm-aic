#
# Lightweight CI for the AMD Infinity Context (AIC) `make export` target.
# Runs the export, sanity-checks the resulting tarball (non-empty, no ignored
# artifacts leaked in, key sources present), and uploads it as a downloadable
# workflow artifact.  No Docker build required.
#
name: rocm-aic - Export Tarball

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/rocm-aic-export-tarball.yml'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/rocm-aic-export-tarball.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: make export (build + validate tarball)
    runs-on: ubuntu-24.04

    steps:
      # Full history so `git ls-files` / `git rev-parse --short HEAD` (used by the
      # export target for the filename stamp) resolve against a real commit.
      - uses: actions/checkout@v7

      - name: Build export tarball
        id: export
        run: |
          set -euo pipefail
          make export
          tarball="$(ls -1 aic-*.tar.gz 2>/dev/null || ls -1 *.tar.gz 2>/dev/null | head -1)"
          test -f "${tarball}" || { echo "ERROR: no tarball produced" >&2; exit 1; }
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "Built ${tarball}"

      - name: Validate image tag helper
        run: |
          set -euo pipefail

          default_tag="$(bash docker/scripts/aic-image-tag.sh)"
          test -n "${default_tag}" \
            || { echo "ERROR: image tag helper returned an empty tag" >&2; exit 1; }
          aic_version="$(< VERSION)"
          : "${aic_version:?VERSION is missing or empty}"
          [[ "${default_tag}" == "${aic_version}-"* ]] \
            || {
              echo "ERROR: tag ${default_tag} does not start with VERSION ${aic_version}" >&2
              exit 1
            }

          # CDNA override: FlashAttention included (ROCM_ARCH unset → conservative default)
          override_tag="$(
            ROCM_VERSION=8.7.6 \
            PYTORCH_SERIES=9.9 \
            PYTORCH_REF=release/9.9 \
            VLLM_REF=v1.2.3 \
            AITER_REF=v0.1.19 \
            FLASH_ATTN_REF=0e60e394 \
            LMCACHE_REF=v2.3.4 \
            NIXL_REF=v3.4.5 \
            HSA_SNOOP_REF=v4.5.6 \
              bash docker/scripts/aic-image-tag.sh
          )"
          expected_override="${aic_version}-rocm8.7.6-pytorch9.9-vllm1.2.3-aiter0.1.19-fa0e60e394-lmcache2.3.4-nixl3.4.5-hsasnoop4.5.6"
          [[ "${override_tag}" == "${expected_override}" ]] \
            || {
              echo "ERROR: expected ${expected_override}, got ${override_tag}" >&2
              exit 1
            }
          # RDNA override: FlashAttention omitted for non-CDNA arch
          rdna_tag="$(
            ROCM_ARCH=gfx1201 \
            ROCM_VERSION=8.7.6 \
            PYTORCH_SERIES=9.9 \
            PYTORCH_REF=release/9.9 \
            VLLM_REF=v1.2.3 \
            AITER_REF=v0.1.19 \
            FLASH_ATTN_REF=0e60e394 \
            LMCACHE_REF=v2.3.4 \
            NIXL_REF=v3.4.5 \
            HSA_SNOOP_REF=v4.5.6 \
              bash docker/scripts/aic-image-tag.sh
          )"
          expected_rdna="${aic_version}-rocm8.7.6-pytorch9.9-vllm1.2.3-aiter0.1.19-lmcache2.3.4-nixl3.4.5-hsasnoop4.5.6-gfx1201"
          [[ "${rdna_tag}" == "${expected_rdna}" ]] \
            || {
              echo "ERROR: RDNA tag: expected ${expected_rdna}, got ${rdna_tag}" >&2
              exit 1
            }
          # Mixed override: FlashAttention included as soon as one arch is gfx9*
          mixed_tag="$(
            ROCM_ARCH=gfx942,gfx1201 \
            ROCM_VERSION=8.7.6 \
            PYTORCH_SERIES=9.9 \
            PYTORCH_REF=release/9.9 \
            VLLM_REF=v1.2.3 \
            AITER_REF=v0.1.19 \
            FLASH_ATTN_REF=0e60e394 \
            LMCACHE_REF=v2.3.4 \
            NIXL_REF=v3.4.5 \
            HSA_SNOOP_REF=v4.5.6 \
              bash docker/scripts/aic-image-tag.sh
          )"
          expected_mixed="${aic_version}-rocm8.7.6-pytorch9.9-vllm1.2.3-aiter0.1.19-fa0e60e394-lmcache2.3.4-nixl3.4.5-hsasnoop4.5.6-gfx942-1201"
          [[ "${mixed_tag}" == "${expected_mixed}" ]] \
            || {
              echo "ERROR: mixed tag: expected ${expected_mixed}, got ${mixed_tag}" >&2
              exit 1
            }
          echo "Default tag: ${default_tag}"
          echo "Override tag (CDNA): ${override_tag}"
          echo "Override tag (RDNA): ${rdna_tag}"

      - name: Validate release notes renderer
        run: |
          set -euo pipefail
          renderer=.github/scripts/workflows/render-release-notes.sh
          fixtures="$(mktemp -d)"
          trap 'rm -rf "${fixtures}"' EXIT
          : > "${fixtures}/lmcache-0.5.6-cp312-cp312-linux_x86_64.whl"
          : > "${fixtures}/nixl_rocm-1.4.1-cp312-cp312-linux_x86_64.whl"
          args=(release v-test deadbeef gfx942 "${fixtures}" ROCm/rocm-aic rocm-aic)
          markdown_tick='`'
          dollar='$'

          current="$(bash "${renderer}" "${args[@]}")"
          printf '%s\n' "${current}" | grep -Eq "^- \*\*Build base:\*\* [^${dollar}]+ \(ROCm [^,]+, Python 3\.12, x86_64\)$"
          printf '%s\n' "${current}" | grep -Eq "^- \*\*LMCache:\*\* .+ @ ${markdown_tick}[^${markdown_tick}]+${markdown_tick} \+ AIC patches$"
          printf '%s\n' "${current}" | grep -Eq "^- \*\*NIXL:\*\* .+ @ ${markdown_tick}[^${markdown_tick}]+${markdown_tick} \+ nixl-rocm-ais-mt patch$"
          printf '%s\n' "${current}" | grep -Fq "https://github.com/ROCm/rocm-aic/releases/download/v-test/lmcache-0.5.6-cp312-cp312-linux_x86_64.whl"

          # Pins come from docker-bake.hcl, so a bake variable override must show up.
          full="$(ROCM_VERSION=7.14.0 LMCACHE_REF=v0.5.4 bash "${renderer}" "${args[@]}")"
          printf '%s\n' "${full}" | grep -F -- '- **Build base:** rocm/dev-ubuntu-24.04:7.14.0-full (ROCm 7.14.0, Python 3.12, x86_64)'
          printf '%s\n' "${full}" | grep -F -- "- **LMCache:** https://github.com/LMCache/LMCache.git @ ${markdown_tick}v0.5.4${markdown_tick} + AIC patches"

          if NIXL_REF='' bash "${renderer}" "${args[@]}" >/dev/null 2>&1; then
            echo "ERROR: renderer accepted a missing NIXL_REF" >&2
            exit 1
          fi
          echo "Release notes render from the docker-bake.hcl pins"

      - name: Validate tarball contents
        run: |
          set -euo pipefail
          tarball="${{ steps.export.outputs.tarball }}"
          echo "Inspecting ${tarball}"

          # Must contain something.
          count="$(tar tzf "${tarball}" | wc -l)"
          test "${count}" -gt 0 || { echo "ERROR: tarball is empty" >&2; exit 1; }
          echo "entries: ${count}"

          # .gitignore must have kept build/run detritus out.
          if tar tzf "${tarball}" | grep -E 'logs/|__pycache__|\.pyc$|\.tar\.gz$'; then
            echo "ERROR: tarball contains files .gitignore should exclude" >&2
            exit 1
          fi

          # Sources needed to actually run the tooling must be present.
          tarball_contents="$(tar tzf "${tarball}")"
          for f in Makefile README.md VERSION pyproject.toml \
                   docker/scripts/aic-image-tag.sh \
                   benchmarks/run_cliff.py benchmarks/plot_cliff.py; do
            echo "${tarball_contents}" | grep -q "${f}" \
              || { echo "ERROR: expected ${f} missing from tarball" >&2; exit 1; }
          done
          echo "All required sources present"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: aic-export-${{ github.sha }}
          path: ${{ steps.export.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14
