# On-demand cliff benchmark, driven by the PR slash command:
#
#   /run-cliff         dist-build-fast -> cliff-short
#
# Self-contained: it builds the images for the SHA first (single-arch,
# AIC_FAST_ARCH), or reuses images/aic-ci-<sha>/ when an earlier run left them
# staged (AIC_REUSE_IMAGES=1; only a flow that kept its images, with
# KEEP_ARTIFACTS=1, leaves any), then runs the cliff.
#
# Cleanup ownership: the cliff is the terminal stage and removes the clone and
# staged images on exit, pass or fail (spur-cliff.sh; this workflow never sets
# KEEP_ARTIFACTS); a failed build removes its own.  A finished run therefore
# leaves nothing to reuse: retry with "Re-run all jobs", which builds again
# unless another flow has staged the images.  "Re-run failed jobs" on the cliff
# job alone fails, because its images are already gone.
#
# Requires (all already in use by sibling hardware-CI workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch

name: rocm-aic - Self Hosted - Cliff Test

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  # Validate /run-cliff slash command on PRs; skipped for other triggers
  authorize:
    if: >
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/run-cliff')
      )
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      target: ${{ steps.resolve.outputs.target }}
      should_run: ${{ steps.resolve.outputs.should_run }}

    steps:
      - name: Check commenter is a maintainer or admin
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const level = data.permission;
            if (level !== 'admin' && level !== 'maintain' && level !== 'write') {
              core.setFailed(`@${context.actor} does not have write/maintain/admin permission (got: ${level})`);
            }

      - name: Resolve SHA, PR number, and cliff target
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('sha', pr.head.sha);
              core.setOutput('pr_number', String(context.issue.number));
              core.setOutput('target', 'cliff-short');
              core.setOutput('should_run', 'true');
            } else {
              // workflow_dispatch
              core.setOutput('sha', context.sha);
              core.setOutput('pr_number', '');
              core.setOutput('target', 'cliff-short');
              core.setOutput('should_run', 'true');
            }

      - name: React to comment with eyes
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

  # Build the single-arch images the cliff loads, unless they are already staged.
  dist-build:
    needs: authorize
    if: needs.authorize.outputs.should_run == 'true'
    # Serialise with the other hardware-CI workflows for the same PR: they share
    # the staged images dir, which the terminal stage of each removes.  Job-level,
    # not workflow-level: every PR comment starts this workflow, and a workflow
    # that has not been authorised would otherwise enter the shared group and, as
    # the single pending slot allows only one waiter, cancel a real /run-cliff.
    concurrency:
      group: hardware-ci-spur-${{ github.event.issue.number || github.sha }}
      cancel-in-progress: false
    runs-on: [self-hosted, rocm-aic-cicd]
    timeout-minutes: 120
    permissions:
      pull-requests: write
      statuses: write
    env:
      AIC_SPUR_HOST: ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS: ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_BUILD_EXCLUDE_NODES: ${{ vars.AIC_BUILD_EXCLUDE_NODES }}
      AIC_REUSE_IMAGES: '1'

    steps:
      - name: Set commit status to pending
        if: needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'pending',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              context: 'hardware-ci / cliff',
              description: 'Building images on the SPUR head node...',
            });

      - name: Build fast image on the SPUR head node (or reuse staged images)
        run: bash /usr/local/lib/aic-ci/spur-dist-build.sh "${{ needs.authorize.outputs.sha }}" dist-build-fast

      - name: Set commit status on failure
        if: failure() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'failure',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              context: 'hardware-ci / cliff',
              description: 'Image build failed — check the run logs',
            });

      - name: Post failure comment on PR
        if: failure() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.authorize.outputs.pr_number || 0 }},
              body: `❌ dist-build-fast failed for ${{ needs.authorize.outputs.sha }}, so the cliff did not run. [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });

  cliff:
    needs: [authorize, dist-build]
    if: needs.authorize.outputs.should_run == 'true'
    # Same group as dist-build above (see the note there).
    concurrency:
      group: hardware-ci-spur-${{ github.event.issue.number || github.sha }}
      cancel-in-progress: false
    runs-on: [self-hosted, rocm-aic-cicd]
    timeout-minutes: 240
    permissions:
      pull-requests: write
      statuses: write
    env:
      AIC_SPUR_HOST: ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS: ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_BUILD_EXCLUDE_NODES: ${{ vars.AIC_BUILD_EXCLUDE_NODES }}

    steps:
      - name: Set commit status to pending
        if: needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'pending',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              context: 'hardware-ci / cliff',
              description: 'Running cliff benchmark on the SPUR head node...',
            });

      - name: Run cliff on the SPUR head node
        run: |
          bash /usr/local/lib/aic-ci/spur-cliff.sh \
            "${{ needs.authorize.outputs.sha }}" \
            "${{ needs.authorize.outputs.target }}"

      - name: Set commit status on success
        if: success() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'success',
              context: 'hardware-ci / cliff',
              description: 'Cliff benchmark passed',
            });

      - name: Set commit status on failure
        if: failure() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'failure',
              context: 'hardware-ci / cliff',
              description: 'Cliff benchmark failed — check the run logs',
            });

      - name: Post result comment on PR
        if: always() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.authorize.outputs.pr_number || 0 }},
              body: success
                ? `✅ Cliff benchmark passed for ${{ needs.authorize.outputs.sha }}.`
                : `❌ Cliff benchmark failed for ${{ needs.authorize.outputs.sha }}. [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });
