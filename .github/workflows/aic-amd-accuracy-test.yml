#
# On-demand KV-integrity gate — comment /run-accuracy on a PR (or dispatch
# manually) to score gsm8k against the tiered arm and assert that routing KV
# through DRAM/NVMe did not change the answers.
#
# The PR path runs accuracy-test-fast: it drops the VRAM-only arm and caps the
# item count, so it loses the differential but keeps the absolute floor, the
# NVMe liveness assertion and the restart check. The nightly runs both arms on
# the full split. See tests/accuracy/README.md.
#
# Requires (all already in use by sibling hardware-CI workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch
#   secrets.AIC_SPUR_CONTROLLER  — SPUR controller address
#   secrets.AIC_HF_TOKEN         — HF token for the model download

name: AIC Hardware Test - AMD Accuracy Test

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  # Validate the /run-accuracy slash command on PRs; skipped for other triggers.
  authorize:
    if: >
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/run-accuracy')
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      target: ${{ steps.resolve.outputs.target }}
      should_run: ${{ steps.resolve.outputs.should_run }}

    steps:
      - name: Check commenter is a maintainer or admin
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const level = data.permission;
            if (level !== 'admin' && level !== 'maintain' && level !== 'write') {
              core.setFailed(`@${context.actor} does not have write/maintain/admin permission (got: ${level})`);
            }

      - name: Resolve SHA, PR number, and accuracy-test target
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('sha', pr.head.sha);
              core.setOutput('pr_number', String(context.issue.number));
            } else {
              // workflow_dispatch
              core.setOutput('sha', context.sha);
              core.setOutput('pr_number', '');
            }
            core.setOutput('target', 'accuracy-test-fast');
            core.setOutput('should_run', 'true');

      - name: React to comment with eyes
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

  accuracy-test:
    needs: authorize
    if: needs.authorize.outputs.should_run == 'true'
    runs-on: [self-hosted, rocm-aic-cicd]
    # The fast path skips the baseline arm and caps gsm8k at 200 of 1319 items.
    # Scaling the measured 49-min full-split tiered pass (SPUR job 6235) gives
    # ~7 min of scoring, so ~13 min end to end including bringup and restart.
    # 45 leaves ~3.4x headroom.
    timeout-minutes: 45
    permissions:
      pull-requests: write
      statuses: write
    env:
      AIC_SPUR_HOST:       ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:      ${{ secrets.AIC_SHARED_NFS }}
      AIC_SPUR_CONTROLLER: ${{ secrets.AIC_SPUR_CONTROLLER }}
      HF_TOKEN:            ${{ secrets.AIC_HF_TOKEN }}

    steps:
      - name: Set commit status to pending
        if: needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'pending',
              context: 'hardware-ci / accuracy-test',
              description: 'Running accuracy-test on the SPUR head node...',
            });

      - name: Run accuracy-test on the SPUR head node
        run: |
          bash /usr/local/lib/aic-ci/spur-accuracy-test.sh \
            "${{ needs.authorize.outputs.sha }}" \
            "${{ needs.authorize.outputs.target }}"

      - name: Set commit status on success
        if: success() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'success',
              context: 'hardware-ci / accuracy-test',
              description: 'Accuracy test passed',
            });

      - name: Set commit status on failure
        if: failure() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.authorize.outputs.sha }}',
              state: 'failure',
              context: 'hardware-ci / accuracy-test',
              description: 'Accuracy test failed — check the run logs',
            });

      - name: Post result comment on PR
        if: always() && needs.authorize.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.authorize.outputs.pr_number || 0 }},
              body: success
                ? `✅ Accuracy test passed for ${{ needs.authorize.outputs.sha }}.`
                : `❌ Accuracy test failed for ${{ needs.authorize.outputs.sha }}. [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });
