# Prevent component metadata in README.md from drifting from the source-built
# stack declared in docker/Dockerfile.

name: AIC README Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - docker/Dockerfile
      - patches/**
      - .github/scripts/workflows/sync-readme-versions.py
      - .github/scripts/workflows/test_sync_readme_versions.py
      - .github/workflows/aic-update-readme-shields.yml
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-readme-versions:
    name: README version metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check README component metadata
        run: python3 .github/scripts/workflows/sync-readme-versions.py --check

      - name: Test README metadata sync
        run: python3 .github/scripts/workflows/test_sync_readme_versions.py
