# Nightly cliff benchmark — the last stage of the nightly chain:
#   Dist Build -> Smoke+Tiny -> Accuracy -> Cliff
#
# workflow_run matches display names, not filenames; keep the upstream
# workflows: entry in sync with rocm-aic-self-hosted-accuracy-test.yml's name:.
#
# The KV cache cliff benchmark sweeps all three arms (vram_only, kvd_v2/nvme,
# kvd_v2/gds), generates a self-contained HTML performance-tracking page, and
# deploys it to GitHub Pages.
#
# Cliff uses the dist-build tarball directly via the SHA in the triggering
# Accuracy run's nightly-head-sha artifact (not its head_sha, which is main's
# tip when Accuracy was triggered), and runs whether Accuracy passed or failed.  It is skipped when
# Accuracy was skipped (Smoke/Tiny failed, which already removed the tarball),
# and when Accuracy was dispatched by hand.  spur-cliff-harvest.sh owns
# terminal cleanup of the clone and tarball via its unconditional EXIT trap.
#
# Requires (all already in use by sibling nightly workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch
#
# GitHub Pages setup (one-time): Settings → Pages → Source: gh-pages branch, / (root).
# The page will be served at https://rocm.github.io/rocm-aic/cliff/.

name: rocm-aic - Self Hosted - Nightly Cliff Test

on:
  workflow_run:
    workflows: ["rocm-aic - Self Hosted - Accuracy Test"]
    types: [completed]

permissions:
  contents: write   # required to push the gh-pages branch
  actions: read     # download Accuracy's nightly-head-sha artifact

jobs:
  cliff:
    if: >
      github.event.workflow_run.event == 'workflow_run' &&
      contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: [self-hosted, rocm-aic-cicd]
    # cliff-submit gives the SPUR job 4h (the sweep ran 2h23m); this adds queue
    # wait plus the harvest and page deploy, so the job limit is reached first.
    timeout-minutes: 360
    env:
      AIC_SPUR_HOST:       ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:      ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_BUILD_EXCLUDE_NODES: ${{ vars.AIC_BUILD_EXCLUDE_NODES }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the SHA under test from Accuracy
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-head-sha
          path: ${{ runner.temp }}/nightly-head-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve the SHA under test
        id: sha
        run: |
          sha="$(< "${RUNNER_TEMP}/nightly-head-sha/head-sha")"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::not a commit SHA: '${sha}'"; exit 1; }
          echo "SHA under test: ${sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Run cliff benchmark + harvest results from SPUR
        env:
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          bash .github/scripts/workflows/spur-cliff-harvest.sh \
            "${HEAD_SHA}" \
            "$(date -u +%Y-%m-%d)"

      - name: Upload cliff performance page artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cliff-perf-page-${{ steps.sha.outputs.sha }}
          path: cliff-page/
          if-no-files-found: error
          retention-days: 90

      - name: Deploy cliff performance page to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cliff-page
          destination_dir: cliff
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
