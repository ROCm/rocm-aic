# Nightly KV Cache Cliff benchmark — runs after the Tiny Test, sweeps all three
# arms (vram_only, kvd_v2/nvme, kvd_v2/gds), generates a self-contained HTML
# performance-tracking page, and deploys it to GitHub Pages.
#
# This stage chains off Tiny Test, as does the Nightly Accuracy Test, so the two
# run CONCURRENTLY and share the SPUR clone + image tarball for the same SHA.
# spur-cliff.sh traps EXIT unconditionally and rm -rf's both, so if this job
# finishes first it can delete artifacts out from under a still-running
# accuracy job.  Chaining this off the Accuracy Test would serialize them but
# is NOT viable: GitHub caps workflow_run chains at three levels beyond the
# initiating workflow, and Dist Build -> Smoke -> Tiny -> Accuracy already uses
# all three.  See the header of aic-amd-nightly-accuracy-test.yml.
#
# Requires (all already in use by sibling nightly workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch
#   secrets.AIC_SPUR_CONTROLLER  — SPUR controller address
#
# GitHub Pages setup (one-time): Settings → Pages → Source: gh-pages branch, / (root).
# The page will be served at https://rocm.github.io/rocm-aic/cliff/.

name: AIC Hardware Test - Nightly Cliff

on:
  workflow_run:
    workflows: ["AIC Hardware Test - Nightly Tiny Test"]
    types: [completed]

permissions:
  contents: write   # required to push the gh-pages branch

jobs:
  cliff:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, rocm-aic-cicd]
    timeout-minutes: 240
    env:
      AIC_SPUR_HOST:       ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:      ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_SPUR_CONTROLLER: ${{ secrets.AIC_SPUR_CONTROLLER }}

    steps:
      - uses: actions/checkout@v4

      - name: Run cliff benchmark + harvest results from SPUR
        run: |
          bash .github/scripts/workflows/spur-cliff-harvest.sh \
            "${{ github.event.workflow_run.head_sha }}" \
            "$(date -u +%Y-%m-%d)"

      - name: Upload cliff performance page artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliff-perf-page-${{ github.event.workflow_run.head_sha }}
          path: cliff-page/
          if-no-files-found: error
          retention-days: 90

      - name: Deploy cliff performance page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cliff-page
          destination_dir: cliff
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
