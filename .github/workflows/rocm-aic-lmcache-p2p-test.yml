#
# LMCache P2P KV-cache sharing test.
#
# Boots two QEMU KVM VMs with emulated ionic RDMA NICs (rocm-ernic TCP mesh)
# via qemu-tool compose (vfio-user-ernic-2vm stack).  Runs the LMCache P2P
# compose stack inside each VM and asserts that VM2's lmcache receives at
# least one P2P KV-cache hit from VM1.
#
# No physical GPU or RDMA hardware required.
# See docs/LMCACHE_P2P.md for full details.

name: rocm-aic - LMCache P2P Test

on:
  schedule:
    # 02:13 UTC — off-peak, off the hour.
    - cron: '13 2 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'docker/compose/lmcache-p2p/**'
      - 'scripts/lmcache-p2p-guest-setup.sh'
      - 'mk/bench.mk'
      - '.github/workflows/rocm-aic-lmcache-p2p-test.yml'
  workflow_dispatch:
    inputs:
      lmcache_image_ref:
        description: >-
          Pre-built LMCache image ref (e.g. ghcr.io/rocm/rocm-aic/aic-lmcache:tag).
          Leave blank to use the default from mk/bench.mk.
        required: false
        default: ''
      vllm_image_ref:
        description: >-
          Pre-built vLLM image ref.  Leave blank to use the default.
        required: false
        default: ''
      qcow2_image:
        description: >-
          Override the ionic guest qcow2 image tag.
          Leave blank to use the pin in mk/bench.mk.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Container image that has qemu-tool, libvfio-user, and QEMU pre-built.
  # Matches the image used by qemu-minimal's own CI.
  QEMU_CI_IMAGE: >-
    docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260929.g2bdbd16-qemu11.1.2-vfu.8039244

jobs:
  lmcache-p2p-test:
    name: LMCache P2P KV-cache sharing (rocm-ernic VMs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    container:
      image: >-
        docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260929.g2bdbd16-qemu11.1.2-vfu.8039244
      options: >-
        --device /dev/kvm
        --network host
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Verify KVM is available
        run: |
          test -c /dev/kvm || { echo "::error::/dev/kvm missing"; exit 1; }
          python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0)" \
            || { echo "::error::KVM_GET_API_VERSION ioctl failed"; exit 1; }
          echo "KVM available: $(ls -l /dev/kvm)"

      - name: Install docker compose plugin
        run: make ensure-compose

      - name: Resolve qcow2 image tag for cache key
        id: qcow2-tag
        run: |
          OVERRIDE="${{ inputs.qcow2_image }}"
          if [ -n "$OVERRIDE" ]; then
            TAG="${OVERRIDE##*:}"
          else
            TAG=$(grep '^AIC_LMCACHE_P2P_QCOW2_IMAGE' mk/bench.mk \
                  | head -1 | sed 's/.*://;s/[[:space:]].*//')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Qcow2 tag: $TAG"

      - name: Cache ionic guest disk (qcow2)
        id: qcow2-cache
        uses: actions/cache@v4
        with:
          path: /var/lib/qemu-tool/images
          key: lmcache-p2p-qcow2-${{ steps.qcow2-tag.outputs.tag }}

      - name: Pull ionic guest disk (cache miss)
        if: steps.qcow2-cache.outputs.cache-hit != 'true'
        run: |
          OVERRIDE="${{ inputs.qcow2_image }}"
          if [ -n "$OVERRIDE" ]; then
            IMG="$OVERRIDE"
          else
            IMG=$(grep '^AIC_LMCACHE_P2P_QCOW2_IMAGE' mk/bench.mk \
                  | head -1 | awk '{print $NF}')
          fi
          echo "Pulling $IMG ..."
          # Job runs as root inside the CI container image — no sudo available.
          mkdir -p /var/lib/qemu-tool/images
          # Extract qcow2 from the OCI FROM-scratch payload image.
          # Pull and create are separated so _cid only captures the container ID.
          docker pull -q "$IMG"
          _cid=$(docker create "$IMG")
          mkdir -p /tmp/qcow2-extract
          docker cp "$_cid:/output/." /tmp/qcow2-extract 2>/dev/null \
            || docker cp "$_cid:/." /tmp/qcow2-extract
          docker rm "$_cid" >/dev/null
          _qcow2=$(find /tmp/qcow2-extract -name '*.qcow2' | head -1)
          [ -n "$_qcow2" ] || { echo "::error::No .qcow2 found in image"; ls -lR /tmp/qcow2-extract; exit 1; }
          cp "$_qcow2" /var/lib/qemu-tool/images/qemu-minimal.qcow2
          cp "$_qcow2" /var/lib/qemu-tool/images/qemu-minimal-2.qcow2
          rm -rf /tmp/qcow2-extract
          ls -lh /var/lib/qemu-tool/images/

      - name: Resolve image refs
        id: images
        run: |
          LMC="${{ inputs.lmcache_image_ref }}"
          VLLM="${{ inputs.vllm_image_ref }}"
          # Fall back to defaults from bench.mk if not supplied via dispatch.
          # In PR/schedule runs the inputs are empty; the make target will use
          # its own defaults (LMCACHE_IMAGE_REF / IMAGE_REF from the env).
          echo "lmcache_ref=${LMC}" >> "$GITHUB_OUTPUT"
          echo "vllm_ref=${VLLM}" >> "$GITHUB_OUTPUT"

      - name: Run LMCache P2P test
        env:
          HF_TOKEN: ${{ secrets.AIC_HF_TOKEN }}
          # VM_IMAGES_DIR is already populated by the cache/pull steps above.
          AIC_LMCACHE_P2P_VM_IMAGES_DIR: /var/lib/qemu-tool/images
          # Disk images were extracted with the default names; pass them through.
          AIC_LMCACHE_P2P_VM1_NAME: qemu-minimal
          AIC_LMCACHE_P2P_VM2_NAME: qemu-minimal-2
          # Tighter timeout for CI — runners are generally faster than dev boxes.
          AIC_LMCACHE_P2P_READY_S: "240"
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ steps.images.outputs.lmcache_ref }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS AIC_LMCACHE_P2P_LMCACHE_IMAGE_REF=${{ steps.images.outputs.lmcache_ref }}"
          fi
          if [ -n "${{ steps.images.outputs.vllm_ref }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS AIC_LMCACHE_P2P_VLLM_IMAGE_REF=${{ steps.images.outputs.vllm_ref }}"
          fi
          # shellcheck disable=SC2086
          make test-lmcache-p2p-local $EXTRA_ARGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lmcache-p2p-logs
          path: /tmp/aic-lmcache-p2p-test/
          retention-days: 3

      - name: Show ernic-2vm compose logs on failure
        if: failure()
        run: |
          python3 -m qemu_tool compose \
            --stack vfio-user-ernic-2vm \
            --vm-name qemu-minimal \
            --vm2-name qemu-minimal-2 \
            logs --tail 60 2>/dev/null || true
