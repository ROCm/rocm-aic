#
# Nightly pip wheels for the AMD Infinity Context (AIC): source-built vLLM (+
# its AITER and FlashAttention backends), patched LMCache, and ROCm NIXL.
#
# Architecture groups
# -------------------
# cdna  gfx90a;gfx942;gfx950   MI100 / MI200 / MI300X / MI355X  (primary target)
# rdna  gfx1100;gfx1101;gfx1150;gfx1151;gfx1200;gfx1201         (RDNA3/4, best-effort)
#
# Scheduled nightly builds CDNA only (the primary hardware target).  Manual
# dispatch can include RDNA via the include_rdna input.  The groups' wheels
# carry identical filenames but different GPU code, so each group has its own
# rolling release: cdna -> `nightly`, rdna -> `nightly-rdna`.
#
# Build pipeline
# --------------
#  warm-base-cdna  ──► build-wheels-cdna  ─┐
#                                          ├─► publish
#  warm-base-rdna  ──► build-wheels-rdna  ─┘
#
# Every build goes through docker/docker-bake.hcl, the single definition of the
# build graph and version pins; the jobs pass only the arch group, the cache
# scope and the TLS cert.
#
# warm-base-*: bakes the `base` target (aic-base: PyTorch + torchvision + NIXL
# source builds) into the GHA layer cache, so the build-wheels-* job that follows
# can skip the multi-hour PyTorch compile when the cache is warm.
#
# build-wheels-*: bakes the `wheels` group (one aic-base, every wheel linked
# against its torch), checks the export against the expected wheel set
# (.github/scripts/workflows/check-wheels.sh), and uploads it as an artifact.
#
# publish: re-checks each group's wheels, stages each release as a draft, and
# only once every draft is uploaded and verified swaps them in for the live
# releases (.github/scripts/workflows/publish-rolling-release.sh).
#
# Compatibility: ROCm 7.14 / Python 3.12 / x86_64, non-manylinux.
# NIXL wheel carries libnixl + plugins/UCX; ROCm runtime is an external dep.
#
name: rocm-aic - Nightly Wheels Publication

on:
  schedule:
    # 06:37 UTC daily -- off the :00 mark on purpose.
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      include_rdna:
        description: 'Also build RDNA wheels (gfx11xx/gfx12xx, adds ~3h)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Build + publish even if main has not changed'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write   # create/update the rolling `nightly` releases

env:
  RELEASE_TAG: nightly
  RELEASE_TAG_RDNA: nightly-rdna
  CDNA_ARCH: 'gfx90a;gfx942;gfx950'
  RDNA_ARCH: 'gfx1100;gfx1101;gfx1150;gfx1151;gfx1200;gfx1201'
  # GHA layer-cache scope prefix.  docker-bake.hcl appends the arch list and the
  # target name, so a group's warm-base and build-wheels jobs share entries and
  # the two groups never do.
  AIC_CACHE_GHA_SCOPE: aic-wheels
  BAKE_FILE: docker/docker-bake.hcl

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether there is anything new to build, and which groups.
  # ---------------------------------------------------------------------------
  check:
    name: Check for changes on main
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      include_rdna: ${{ steps.decide.outputs.include_rdna }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve main HEAD
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Compare to last published nightly
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          INCLUDE_RDNA: ${{ github.event.inputs.include_rdna }}
        run: |
          set -euo pipefail
          last="$(gh release view "${RELEASE_TAG}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --json targetCommitish -q .targetCommitish 2>/dev/null || echo '')"
          echo "main HEAD:        ${HEAD_SHA}"
          echo "last nightly sha: ${last:-<none>}"
          if [ "${FORCE}" = "true" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "reason: manual/force run"
          elif [ -z "${last}" ] || [ "${last}" != "${HEAD_SHA}" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "reason: main changed since last nightly"
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "reason: no change -- skipping"
          fi
          # RDNA is opt-in on manual dispatch only; scheduled runs are CDNA-only.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INCLUDE_RDNA}" = "true" ]; then
            echo "include_rdna=true" >> "${GITHUB_OUTPUT}"
          else
            echo "include_rdna=false" >> "${GITHUB_OUTPUT}"
          fi

  # ---------------------------------------------------------------------------
  # The four build jobs (warm-base-cdna, warm-base-rdna, build-wheels-cdna,
  # build-wheels-rdna) are explicit jobs rather than a matrix so that the RDNA
  # jobs can have independent job-level `if:` conditions.  The matrix context
  # is not available in jobs.<id>.if on GitHub Actions.
  # ---------------------------------------------------------------------------

  # --- CDNA base warm-up -----------------------------------------------------
  warm-base-cdna:
    name: Warm base cache (cdna)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Write corp CA cert secret
        id: cert
        run: |
          if [ -n "${{ secrets.CORP_CA_CERT }}" ]; then
            echo "${{ secrets.CORP_CA_CERT }}" > /tmp/corp-ca.crt
            echo "path=/tmp/corp-ca.crt" >> "${GITHUB_OUTPUT}"
          fi

      - name: Bake aic-base (PyTorch + torchvision + NIXL) → populate cache
        uses: docker/bake-action@v6
        env:
          ROCM_ARCH: ${{ env.CDNA_ARCH }}
          TLS_CERT: ${{ steps.cert.outputs.path }}
        with:
          source: .
          files: ${{ env.BAKE_FILE }}
          targets: base

  # --- RDNA base warm-up (scheduled runs excluded) ---------------------------
  warm-base-rdna:
    name: Warm base cache (rdna)
    needs: check
    if: needs.check.outputs.should_build == 'true' && needs.check.outputs.include_rdna == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Write corp CA cert secret
        id: cert
        run: |
          if [ -n "${{ secrets.CORP_CA_CERT }}" ]; then
            echo "${{ secrets.CORP_CA_CERT }}" > /tmp/corp-ca.crt
            echo "path=/tmp/corp-ca.crt" >> "${GITHUB_OUTPUT}"
          fi

      - name: Bake aic-base (PyTorch + torchvision + NIXL) → populate cache
        uses: docker/bake-action@v6
        env:
          ROCM_ARCH: ${{ env.RDNA_ARCH }}
          TLS_CERT: ${{ steps.cert.outputs.path }}
        with:
          source: .
          files: ${{ env.BAKE_FILE }}
          targets: base

  # --- CDNA wheel build ------------------------------------------------------
  build-wheels-cdna:
    name: Build wheels (cdna)
    needs: [check, warm-base-cdna]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Write corp CA cert secret
        id: cert
        run: |
          if [ -n "${{ secrets.CORP_CA_CERT }}" ]; then
            echo "${{ secrets.CORP_CA_CERT }}" > /tmp/corp-ca.crt
            echo "path=/tmp/corp-ca.crt" >> "${GITHUB_OUTPUT}"
          fi

      - name: Bake the wheels group → wheels-out/
        uses: docker/bake-action@v6
        env:
          ROCM_ARCH: ${{ env.CDNA_ARCH }}
          TLS_CERT: ${{ steps.cert.outputs.path }}
          WHEELS_DIR: wheels-out
        with:
          source: .
          files: ${{ env.BAKE_FILE }}
          targets: wheels

      - name: Collect and check wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find wheels-out -name '*.whl' -exec mv -t dist {} +
          bash .github/scripts/workflows/check-wheels.sh dist "${CDNA_ARCH}"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-cdna
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 2

  # --- RDNA wheel build (scheduled runs excluded) ----------------------------
  build-wheels-rdna:
    name: Build wheels (rdna)
    needs: [check, warm-base-rdna]
    if: needs.check.outputs.should_build == 'true' && needs.check.outputs.include_rdna == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Write corp CA cert secret
        id: cert
        run: |
          if [ -n "${{ secrets.CORP_CA_CERT }}" ]; then
            echo "${{ secrets.CORP_CA_CERT }}" > /tmp/corp-ca.crt
            echo "path=/tmp/corp-ca.crt" >> "${GITHUB_OUTPUT}"
          fi

      - name: Bake the wheels group → wheels-out/
        uses: docker/bake-action@v6
        env:
          ROCM_ARCH: ${{ env.RDNA_ARCH }}
          TLS_CERT: ${{ steps.cert.outputs.path }}
          WHEELS_DIR: wheels-out
        with:
          source: .
          files: ${{ env.BAKE_FILE }}
          targets: wheels

      - name: Collect and check wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find wheels-out -name '*.whl' -exec mv -t dist {} +
          bash .github/scripts/workflows/check-wheels.sh dist "${RDNA_ARCH}"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-rdna
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 2

  # ---------------------------------------------------------------------------
  # Publish each built group to its rolling release.  Runs only when every
  # requested group built: the default success() guard would skip this job on
  # every scheduled run (build-wheels-rdna is skipped there, and a skipped need
  # skips its dependents), so the condition is spelled out instead.  A failed,
  # or warm-base-skipped, RDNA build on an include_rdna run blocks CDNA too.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish nightly releases
    needs: [check, build-wheels-cdna, build-wheels-rdna]
    if: >-
      !cancelled() &&
      needs.check.outputs.should_build == 'true' &&
      needs.build-wheels-cdna.result == 'success' &&
      (needs.check.outputs.include_rdna != 'true' || needs.build-wheels-rdna.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Two runs swapping the same release at once would race on its tag.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
      INCLUDE_RDNA: ${{ needs.check.outputs.include_rdna }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1

      - name: Download CDNA wheels
        uses: actions/download-artifact@v7
        with:
          name: wheels-cdna
          path: dist/cdna

      - name: Download RDNA wheels
        if: needs.check.outputs.include_rdna == 'true'
        uses: actions/download-artifact@v7
        with:
          name: wheels-rdna
          path: dist/rdna

      - name: Check wheels and compose release notes
        run: |
          set -euo pipefail
          s=.github/scripts/workflows
          bash "${s}/check-wheels.sh" dist/cdna "${CDNA_ARCH}"
          bash "${s}/render-release-notes.sh" nightly "${RELEASE_TAG}" "${SOURCE_SHA}" \
            "${CDNA_ARCH}" dist/cdna "${GITHUB_REPOSITORY}" > notes-cdna.md
          cat notes-cdna.md
          if [ "${INCLUDE_RDNA}" = "true" ]; then
            bash "${s}/check-wheels.sh" dist/rdna "${RDNA_ARCH}"
            bash "${s}/render-release-notes.sh" nightly "${RELEASE_TAG_RDNA}" "${SOURCE_SHA}" \
              "${RDNA_ARCH}" dist/rdna "${GITHUB_REPOSITORY}" > notes-rdna.md
            cat notes-rdna.md
          fi

      # Stage every release before promoting any, so an upload failure leaves
      # all of them on the previous night's wheels.
      - name: Stage releases as drafts
        id: stage
        run: |
          set -euo pipefail
          p=.github/scripts/workflows/publish-rolling-release.sh
          cdna="$(bash "${p}" stage "${RELEASE_TAG}" "${SOURCE_SHA}" \
            "AIC nightly wheels (CDNA)" notes-cdna.md dist/cdna)"
          echo "cdna=${cdna}" >> "${GITHUB_OUTPUT}"
          if [ "${INCLUDE_RDNA}" = "true" ]; then
            rdna="$(bash "${p}" stage "${RELEASE_TAG_RDNA}" "${SOURCE_SHA}" \
              "AIC nightly wheels (RDNA)" notes-rdna.md dist/rdna)"
            echo "rdna=${rdna}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Promote staged releases
        env:
          STAGED_CDNA: ${{ steps.stage.outputs.cdna }}
          STAGED_RDNA: ${{ steps.stage.outputs.rdna }}
        run: |
          set -euo pipefail
          p=.github/scripts/workflows/publish-rolling-release.sh
          bash "${p}" promote "${RELEASE_TAG}" "${STAGED_CDNA}" "${SOURCE_SHA}"
          if [ "${INCLUDE_RDNA}" = "true" ]; then
            bash "${p}" promote "${RELEASE_TAG_RDNA}" "${STAGED_RDNA}" "${SOURCE_SHA}"
          fi
