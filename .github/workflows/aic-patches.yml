#
# Lightweight push-triggered CI for the AMD Infinity Context (AIC) stack.
# Validates that all vLLM, LMCache, and NIXL patches apply cleanly against their
# pinned upstream SHAs without requiring a full Docker build.
#
name: AIC Nightly Patch Validation

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'patches/**'
      - '.github/workflows/aic-patches.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'patches/**'
      - '.github/workflows/aic-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vllm-patches:
    name: vLLM patches (git apply --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve vLLM ref and URL from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG VLLM_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG VLLM_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          test -n "${ref}" || { echo "VLLM_REF not set in Dockerfile"; exit 1; }
          test -n "${url}" || { echo "VLLM_GIT_URL not set in Dockerfile"; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "vLLM: ${url} @ ${ref}"

      - name: Clone vLLM at pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.meta.outputs.ref }}" \
            --filter=blob:none "${{ steps.meta.outputs.url }}" /tmp/vllm
          cd /tmp/vllm
          echo "Checked out: $(git log --oneline -1)"

      - name: Verify all vLLM patches apply cleanly
        run: |
          set -euo pipefail
          patch_dir="${GITHUB_WORKSPACE}/patches/vllm"
          shopt -s nullglob
          patches=( "${patch_dir}"/*.patch )
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no .patch files in ${patch_dir}" >&2
            exit 1
          fi
          cd /tmp/vllm
          for patch in "${patches[@]}"; do
            echo "==> git apply --check $(basename "${patch}")"
            git apply --check "${patch}"
            git apply "${patch}"
          done
          git diff --check
          if git diff --diff-filter=D --name-only | grep -q .; then
            echo "ERROR: a vLLM patch unexpectedly deletes a tracked source file" >&2
            git diff --diff-filter=D --name-only >&2
            exit 1
          fi
          echo "All vLLM patches OK"

  lmcache-patches:
    name: LMCache patches (git apply --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve LMCache ref and URL from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG LMCACHE_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG LMCACHE_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          test -n "${ref}" || { echo "LMCACHE_REF not set in Dockerfile"; exit 1; }
          test -n "${url}" || { echo "LMCACHE_GIT_URL not set in Dockerfile"; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "LMCache: ${url} @ ${ref}"

      - name: Clone LMCache at pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.meta.outputs.ref }}" \
            --filter=blob:none "${{ steps.meta.outputs.url }}" /tmp/LMCache
          cd /tmp/LMCache
          echo "Checked out: $(git log --oneline -1)"

      - name: Verify all LMCache patches apply cleanly
        run: |
          set -euo pipefail
          patch_dir="${GITHUB_WORKSPACE}/patches/lmcache"
          shopt -s nullglob
          patches=( "${patch_dir}"/*.patch )
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no .patch files in ${patch_dir}" >&2
            exit 1
          fi
          cd /tmp/LMCache
          for patch in "${patches[@]}"; do
            echo "==> git apply --check $(basename "${patch}")"
            git apply --check "${patch}"
            git apply "${patch}"
          done
          git diff --check
          if git diff --diff-filter=D --name-only | grep -q .; then
            echo "ERROR: an LMCache patch unexpectedly deletes a tracked source file" >&2
            git diff --diff-filter=D --name-only >&2
            exit 1
          fi
          echo "All LMCache patches OK"

  nixl-patches:
    name: NIXL patches (git apply --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve NIXL ref and URL from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG NIXL_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG NIXL_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          test -n "${ref}" || { echo "NIXL_REF not set in Dockerfile"; exit 1; }
          test -n "${url}" || { echo "NIXL_GIT_URL not set in Dockerfile"; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "NIXL: ${url} @ ${ref}"

      - name: Clone NIXL at pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.meta.outputs.ref }}" \
            --filter=blob:none "${{ steps.meta.outputs.url }}" /tmp/nixl
          cd /tmp/nixl
          echo "Checked out: $(git log --oneline -1)"

      - name: Verify NIXL patches apply cleanly
        run: |
          set -euo pipefail
          patch_dir="${GITHUB_WORKSPACE}/patches/nixl"
          shopt -s nullglob
          patches=( "${patch_dir}"/*.patch )
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no .patch files in ${patch_dir}" >&2
            exit 1
          fi
          cd /tmp/nixl
          for patch in "${patches[@]}"; do
            echo "==> git apply --check $(basename "${patch}")"
            git apply --check "${patch}"
            git apply "${patch}"
          done
          git diff --check
          if git diff --diff-filter=D --name-only | grep -q .; then
            echo "ERROR: a NIXL patch unexpectedly deletes a tracked source file" >&2
            git diff --diff-filter=D --name-only >&2
            exit 1
          fi
          echo "All NIXL patches OK"
  llm-emu-patches:
    name: LLM-Emu patches + profile packs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve LLM-Emu ref and URL from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG LLM_EMU_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG LLM_EMU_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          test -n "${ref}" || { echo "LLM_EMU_REF not set in Dockerfile"; exit 1; }
          test -n "${url}" || { echo "LLM_EMU_GIT_URL not set in Dockerfile"; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "LLM-Emu: ${url} @ ${ref}"

      - name: Clone LLM-Emu at pinned ref
        run: |
          set -euo pipefail
          # LLM_EMU_REF is a commit SHA, not a tag, so --branch cannot be used;
          # the repo is small enough to clone whole.
          git clone "${{ steps.meta.outputs.url }}" /tmp/llm-emu
          git -C /tmp/llm-emu checkout "${{ steps.meta.outputs.ref }}"
          echo "Checked out: $(git -C /tmp/llm-emu log --oneline -1)"

      - name: Verify LLM-Emu patches apply cleanly, in order
        run: |
          set -euo pipefail
          patch_dir="${GITHUB_WORKSPACE}/patches/llm-emu"
          shopt -s nullglob
          patches=( "${patch_dir}"/*.patch )
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no .patch files in ${patch_dir}" >&2
            exit 1
          fi
          cd /tmp/llm-emu
          for patch in "${patches[@]}"; do
            echo "==> git apply --check $(basename "${patch}")"
            if git apply --check "${patch}" 2>/dev/null; then
              echo "    OK (applies cleanly)"
              git apply "${patch}"
            else
              if git apply --check --reverse "${patch}" 2>/dev/null; then
                echo "    SKIP (already merged upstream)"
              else
                echo "    FAIL: patch does not apply and is not already merged"
                git apply --check "${patch}"
                exit 1
              fi
            fi
          done
          echo "All LLM-Emu patches OK"

      - name: Install the patched plugin (no deps -- no torch, no vLLM needed)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip setuptools wheel
          python3 -m pip install --quiet --no-deps /tmp/llm-emu
          # Upstream's pyproject declares no subpackages; they survive only via a
          # package-data catch-all, so assert every one of them is importable.
          python3 -c "
          import vllm_emulator.hooks.executor_hook
          import vllm_emulator.oracle
          import vllm_emulator.profile.loader
          import vllm_emulator.profiler.trace_profiler
          print('vllm_emulator subpackages import OK')
          "

      - name: Validate the committed profile packs
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.github/scripts/validate-profile-packs.py"

  lmcache-patches:
    name: LMCache patches (git apply --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve LMCache ref and URL from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG LMCACHE_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG LMCACHE_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          test -n "${ref}" || { echo "LMCACHE_REF not set in Dockerfile"; exit 1; }
          test -n "${url}" || { echo "LMCACHE_GIT_URL not set in Dockerfile"; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "LMCache: ${url} @ ${ref}"

      - name: Clone LMCache at pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.meta.outputs.ref }}" \
            --filter=blob:none "${{ steps.meta.outputs.url }}" /tmp/LMCache
          cd /tmp/LMCache
          echo "Checked out: $(git log --oneline -1)"

      - name: Verify all LMCache patches apply cleanly
        run: |
          set -euo pipefail
          patch_dir="${GITHUB_WORKSPACE}/patches/lmcache"
          shopt -s nullglob
          patches=( "${patch_dir}"/*.patch )
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no .patch files in ${patch_dir}" >&2
            exit 1
          fi
          cd /tmp/LMCache
          for patch in "${patches[@]}"; do
            echo "==> git apply --check $(basename "${patch}")"
            if git apply --check "${patch}" 2>/dev/null; then
              echo "    OK (applies cleanly)"
              git apply "${patch}"
            else
              # Check if it was already merged
              if git apply --check --reverse "${patch}" 2>/dev/null; then
                echo "    SKIP (already merged upstream)"
              else
                echo "    FAIL: patch does not apply and is not already merged"
                git apply --check "${patch}"  # re-run to show error
                exit 1
              fi
            fi
          done
          echo "All LMCache patches OK"

  nixl-patches:
    name: NIXL patches (git apply --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve NIXL ref and URL from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG NIXL_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG NIXL_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          test -n "${ref}" || { echo "NIXL_REF not set in Dockerfile"; exit 1; }
          test -n "${url}" || { echo "NIXL_GIT_URL not set in Dockerfile"; exit 1; }
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "NIXL: ${url} @ ${ref}"

      - name: Clone NIXL at pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.meta.outputs.ref }}" \
            --filter=blob:none "${{ steps.meta.outputs.url }}" /tmp/nixl
          cd /tmp/nixl
          echo "Checked out: $(git log --oneline -1)"

      - name: Verify NIXL patches apply cleanly
        run: |
          set -euo pipefail
          patch_dir="${GITHUB_WORKSPACE}/patches/nixl"
          shopt -s nullglob
          patches=( "${patch_dir}"/*.patch )
          if (( ${#patches[@]} == 0 )); then
            echo "ERROR: no .patch files in ${patch_dir}" >&2
            exit 1
          fi
          cd /tmp/nixl
          for patch in "${patches[@]}"; do
            echo "==> git apply --check $(basename "${patch}")"
            if git apply --check "${patch}" 2>/dev/null; then
              echo "    OK (applies cleanly)"
              git apply "${patch}"
            else
              if git apply --check --reverse "${patch}" 2>/dev/null; then
                echo "    SKIP (already merged upstream)"
              else
                echo "    FAIL: patch does not apply and is not already merged"
                git apply --check "${patch}"
                exit 1
              fi
            fi
          done
          echo "All NIXL patches OK"

  emulate-oracle-check:
    name: LLM-Emu oracle in-process validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve LLM-Emu ref from Dockerfile
        id: meta
        run: |
          set -euo pipefail
          ref="$(grep -E '^ARG LLM_EMU_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG LLM_EMU_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Clone LLM-Emu and apply patches
        run: |
          set -euo pipefail
          git clone "${{ steps.meta.outputs.url }}" /tmp/llm-emu
          git -C /tmp/llm-emu checkout "${{ steps.meta.outputs.ref }}"
          for patch in patches/llm-emu/*.patch; do
            git -C /tmp/llm-emu apply "$patch"
            echo "Applied: $(basename $patch)"
          done

      - name: Install plugin (no deps — no torch needed for oracle)
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet --no-deps /tmp/llm-emu

      - name: Run oracle against every committed profile pack
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          packs = list(Path("profiles").glob("*.json"))
          if not packs:
              print("No profile packs found — skipping oracle check")
              sys.exit(0)

          from vllm_emulator.oracle import create_oracle_from_profile_pack
          from vllm_emulator.profile.loader import load_profile_pack

          failures = []
          for pack_path in sorted(packs):
              print(f"Checking {pack_path.name} ...")
              try:
                  pack = load_profile_pack(pack_path)
                  oracle = create_oracle_from_profile_pack(pack)
                  # Ask for a latency at a representative (tokens=512, concurrency=1, kv_depth=0) point
                  latency = oracle.get_step_latency(num_tokens=512, concurrency=1, kv_depth=0.0)
                  assert isinstance(latency, float) and latency > 0, \
                      f"oracle returned non-positive latency: {latency}"
                  print(f"  OK: oracle returns {latency*1000:.1f} ms at (512 tok, c=1, kv=0)")
              except Exception as exc:
                  failures.append(f"{pack_path.name}: {exc}")
                  print(f"  FAIL: {exc}", file=sys.stderr)

          if failures:
              print("\nFailed packs:", file=sys.stderr)
              for f in failures:
                  print(f"  {f}", file=sys.stderr)
              sys.exit(1)
          print(f"\nAll {len(packs)} pack(s) passed oracle check")
          PYEOF
