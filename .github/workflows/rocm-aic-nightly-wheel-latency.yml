#
# Nightly wheel latency benchmark.
#
# Runs after the nightly CDNA wheels are published.  Builds the AIC image at
# the same commit, installs the wheels into it on a real MI355X (gfx950) SPUR
# node and measures end-to-end
# request latency across 4 KV-cache tiers (cold / hot-VRAM / L1-DRAM /
# L2-disk) at 5 ISL tiers (1 100 – 35 200 tokens).  Results are published to
# https://rocm.github.io/rocm-aic/wheel-latency/.
#
# Trigger: after rocm-aic - Nightly Wheels Publication succeeds.
# Manual dispatch: workflow_dispatch (always runs against current nightly tag).

name: rocm-aic - Nightly Wheel Latency Benchmark

on:
  # zizmor: ignore[dangerous-triggers] workflow_run fires on completed external
  # workflow events only; this workflow never runs untrusted PR code.
  workflow_run:
    workflows: ["rocm-aic - Nightly Wheels Publication"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish results to GitHub Pages'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write      # push to gh-pages
  pages: write

concurrency:
  group: wheel-latency
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Did the triggering run publish?  It can succeed without touching the
  # release -- a /run-wheels PR test, a publish=false dispatch, a schedule with
  # nothing new on main -- and workflow_run does not say which jobs ran.
  # ---------------------------------------------------------------------------
  check-published:
    name: Check the wheel run published
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Read the publish job's conclusion
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # The publication workflow's `publish` job, matched by its name.
          conclusion="$(gh api --paginate \
                          "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                          -q '.jobs[] | select(.name == "Publish nightly releases") | .conclusion')"
          echo "publish job conclusion: ${conclusion:-<not in run>}"
          published=false
          [[ "${conclusion}" != success ]] || published=true
          echo "published=${published}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Run the 4-phase latency benchmark on a SPUR MI355X node.
  # ---------------------------------------------------------------------------
  run-latency-bench:
    name: Run wheel latency benchmark on SPUR
    needs: check-published
    # Only after a run that published, or on manual dispatch (which skips
    # check-published, hence !cancelled()).
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.check-published.outputs.published == 'true'
      )
    runs-on: [self-hosted, rocm-aic-cicd]
    # A two-hour image build plus the one-hour test job, and their queueing.
    timeout-minutes: 240
    env:
      AIC_SPUR_HOST:        ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:       ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT:  ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_BUILD_EXCLUDE_NODES: ${{ vars.AIC_BUILD_EXCLUDE_NODES }}
      NIGHTLY_TAG:          nightly
      VLLM_MODEL:           Qwen/Qwen3-4B
      # Resolved via env to avoid template-injection in the run blocks.
      TRIGGER_SHA:          ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TRIGGER_SHA }}
          fetch-depth: 1

      # This runner is not a SPUR node (no /shared_nfs, no sbatch): the script
      # SSHes to the head node, which downloads the wheels to NFS for the
      # compute node (no GitHub access there), runs the sbatch, and copies the
      # job log back.
      - name: Run latency benchmark on SPUR
        id: bench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheels="$(gh release view "${NIGHTLY_TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --json assets -q '[.assets[].name | select(endswith(".whl"))] | join(",")')"
          [[ -n "${wheels}" ]] || { echo "ERROR: release ${NIGHTLY_TAG} has no wheels"; exit 1; }
          out_dir="${RUNNER_TEMP}/wheel-latency-log"
          bash .github/scripts/workflows/spur-wheel-latency.sh \
            "${TRIGGER_SHA}" "${NIGHTLY_TAG}" "${wheels}" "${out_dir}"
          LOG_FILE="${out_dir}/wheel-test.out"
          echo "log_file=${LOG_FILE}" >> "${GITHUB_OUTPUT}"

          # Fail the step if the benchmark itself failed.
          grep -q "WHEEL TEST PASSED" "${LOG_FILE}" \
            || { echo "Benchmark FAILED — see log: ${LOG_FILE}"; cat "${LOG_FILE}" | tail -30; exit 1; }
          echo "Benchmark PASSED."

      # The raw job log, kept on failure too: it is the only copy that leaves SPUR.
      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-latency-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheel-latency-log/
          if-no-files-found: ignore
          retention-days: 14

      # Render the results into an HTML page and a JSON summary.
      - name: Render results
        id: render
        env:
          BENCH_LOG: ${{ steps.bench.outputs.log_file }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/wheel-latency"
          mkdir -p "${OUT_DIR}"

          SHA="${TRIGGER_SHA}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 "${GITHUB_WORKSPACE}/.github/scripts/workflows/render-wheel-latency.py" \
            "${BENCH_LOG}" \
            "${SHA}" \
            "${DATE}" \
            "${OUT_DIR}/index.html"

          echo "out_dir=${OUT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "date=${DATE}" >> "${GITHUB_OUTPUT}"
          cat "${OUT_DIR}/index.html" | head -10  # sanity preview

      # Upload the rendered page as a workflow artifact (always, even on failure).
      - name: Upload results artifact
        if: always() && steps.render.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-latency-${{ steps.render.outputs.sha && steps.render.outputs.sha || github.sha }}
          path: ${{ steps.render.outputs.out_dir }}/
          retention-days: 90

      # Publish to gh-pages under /wheel-latency/.
      - name: Publish to GitHub Pages
        if: >
          steps.render.outcome == 'success' &&
          (github.event_name == 'workflow_run' ||
           github.event.inputs.publish == 'true')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ${{ steps.render.outputs.out_dir }}
          destination_dir: wheel-latency
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
          commit_message: >
            chore: update wheel latency results
            (${{ steps.render.outputs.sha && steps.render.outputs.sha || github.sha }},
            ${{ steps.render.outputs.date }})
