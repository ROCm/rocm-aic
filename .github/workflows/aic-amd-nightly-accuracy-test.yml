#
# Nightly KV-integrity gate — runs after the Tiny Test and scores gsm8k against
# both a VRAM-only arm and a tiered (LMCache + NIXL POSIX NVMe) arm, asserting
# that routing KV through DRAM/NVMe did not change the answers.
#
# Unlike the PR path this keeps both arms and the full gsm8k split: the nightly
# is where the differential is worth its wall clock, and where the score keeps
# enough resolution for DELTA to mean something. See tests/accuracy/README.md.
#
# The nightly cliff stage also chains off Tiny Test, so this workflow runs
# CONCURRENTLY with it, not before it.  KEEP_ARTIFACTS=1 leaves the clone and
# tarball in place because spur-cliff.sh owns the terminal cleanup.
#
# KNOWN HAZARD (unfixed): because the two stages are concurrent rather than
# serialized, spur-cliff.sh's unconditional EXIT trap can rm -rf the shared
# clone and tarball while this job is still using them, if cliff finishes
# first.  The obvious fix — chaining cliff off this workflow instead of off
# Tiny Test — is NOT viable: GitHub caps workflow_run chains at three levels
# beyond the initiating workflow.  This nightly chain already spends all three
# (Dist Build -> Smoke -> Tiny -> Accuracy), so a cliff chained off Accuracy
# would be a fourth level and would silently never run.  Serializing the two
# requires collapsing them into one workflow with a `needs:` edge instead.
#
# Requires (all already in use by sibling nightly workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch
#   secrets.AIC_SPUR_CONTROLLER  — SPUR controller address
#   secrets.AIC_HF_TOKEN         — HF token for the model download

name: AIC Hardware Test - Nightly Accuracy Test

on:
  workflow_run:
    workflows: ["AIC Hardware Test - Nightly Tiny Test"]
    types: [completed]

jobs:
  accuracy-test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, rocm-aic-cicd]
    # A measured two-arm full-split run took ~58 min (SPUR job 6235): two
    # bringups ~6, baseline scoring ~1, tiered scoring ~49, restart ~2. The
    # tiered pass dominates -- scoring through LMCache is ~70x slower than
    # VRAM-only. 150 leaves ~2.6x headroom for a slower node or a cold HF cache.
    timeout-minutes: 150
    env:
      AIC_SPUR_HOST:       ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:      ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_SPUR_CONTROLLER: ${{ secrets.AIC_SPUR_CONTROLLER }}
      HF_TOKEN:            ${{ secrets.AIC_HF_TOKEN }}

    steps:
      - name: Run accuracy-test on SPUR head node
        # Keep artifacts: the nightly cliff stage reuses the clone + tarball and
        # owns the final cleanup.
        run: KEEP_ARTIFACTS=1 bash /usr/local/lib/aic-ci/spur-accuracy-test.sh "${{ github.event.workflow_run.head_sha }}"
