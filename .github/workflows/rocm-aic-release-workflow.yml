#
# Versioned stable release for the AMD Infinity Context (AIC).
#
# Triggered by pushing a v* tag (e.g. git tag v1.0.0 && git push origin v1.0.0).
# Produces a full (non-prerelease) GitHub Release containing:
#
#   - vLLM/AITER/FlashAttention + LMCache + NIXL ROCm pip wheels (the same
#     docker-bake.hcl `wheels` group and wheel-set check as the nightly)
#   - Source tarball from `make export`
#   - Full Docker image pushed to Docker Hub as rocm-aic:<tag> and rocm-aic:latest
#
# Secrets required:
#   CORP_CA_CERT      (optional) AMD Zscaler corp CA cert for BuildKit
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  for Docker Hub push
#
name: rocm-aic - Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the versioned GitHub Release

env:
  IMAGE_NAME: rocm-aic
  ROCM_ARCH: 'gfx90a;gfx942;gfx950;gfx1100;gfx1101;gfx1150;gfx1151;gfx1200;gfx1201'

jobs:
  release:
    name: Build + publish release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history so `make export` can resolve tags

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      # AIC_VERSION is a required build-arg (the Dockerfile fails the build when
      # it is empty) and feeds the OCI version labels.  Same step as rocm-aic-docker-build.yml.
      - name: Read AIC version
        id: imgtag
        run: |
          set -euo pipefail
          aic_version="$(< VERSION)"
          : "${aic_version:?VERSION is missing or empty}"
          echo "aic_version=${aic_version}" >> "${GITHUB_OUTPUT}"

      # Corp CA cert (AMD Zscaler) as a BuildKit secret, only if set.
      # Never written into any image layer.  Same pattern as rocm-aic-docker-build.yml.
      - name: Write corp CA cert secret
        id: cert
        run: |
          if [ -n "${{ secrets.CORP_CA_CERT }}" ]; then
            echo "${{ secrets.CORP_CA_CERT }}" > /tmp/corp-ca.crt
            echo "path=/tmp/corp-ca.crt" >> "${GITHUB_OUTPUT}"
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      # ---------------------------------------------------------------------------
      # Build pip wheels
      # ---------------------------------------------------------------------------
      # Build definition and version pins come from docker-bake.hcl; only the
      # arch list, cache scope and cert vary here.
      - name: Bake the wheels group → wheels-out/
        uses: docker/bake-action@v6
        env:
          ROCM_ARCH: ${{ env.ROCM_ARCH }}
          AIC_VERSION: ${{ steps.imgtag.outputs.aic_version }}
          TLS_CERT: ${{ steps.cert.outputs.path }}
          AIC_CACHE_GHA_SCOPE: aic-release
          WHEELS_DIR: wheels-out
        with:
          source: .
          files: docker/docker-bake.hcl
          targets: wheels

      - name: Collect and check wheels
        run: |
          set -euo pipefail
          mkdir -p wheels
          find wheels-out -name '*.whl' -exec mv -t wheels {} +
          bash .github/scripts/workflows/check-wheels.sh wheels "${ROCM_ARCH}"

      # ---------------------------------------------------------------------------
      # Build source tarball
      # ---------------------------------------------------------------------------
      - name: Build source tarball (make export)
        run: |
          set -euo pipefail
          make export
          tarball="$(ls aic-release-*.tar.gz 2>/dev/null | head -1)"
          [ -n "${tarball}" ] || { echo "ERROR: make export produced no tarball" >&2; exit 1; }
          echo "TARBALL=${tarball}" >> "${GITHUB_ENV}"
          echo "Source tarball: ${tarball} ($(du -h "${tarball}" | cut -f1))"

      # ---------------------------------------------------------------------------
      # Build + push full Docker image
      # ---------------------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/lmcache/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            ROCM_ARCH=${{ env.ROCM_ARCH }}
            AIC_VERSION=${{ steps.imgtag.outputs.aic_version }}
          secrets: |
            ${{ steps.cert.outputs.present == 'true' && format('tls_cert={0}', steps.cert.outputs.path) || '' }}
          cache-from: type=gha,scope=aic
          cache-to: type=gha,mode=max,scope=aic

      # ---------------------------------------------------------------------------
      # Compose release notes + publish
      # ---------------------------------------------------------------------------
      - name: Compose release notes
        run: |
          set -euo pipefail
          bash .github/scripts/workflows/render-release-notes.sh release \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${ROCM_ARCH}" \
            wheels \
            "${GITHUB_REPOSITORY}" \
            "${IMAGE_NAME}" \
            > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "${tag}" wheels/*.whl "${TARBALL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AIC ${tag}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
          echo "Published release ${tag} at ${{ github.sha }}"
