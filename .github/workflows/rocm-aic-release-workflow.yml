#
# Versioned stable release for the AMD Infinity Context (AIC).
#
# Triggered by pushing a v* tag (e.g. git tag v1.0.0 && git push origin v1.0.0).
# Produces a full (non-prerelease) GitHub Release containing:
#
#   - vLLM/AITER/FlashAttention + LMCache + NIXL ROCm pip wheels (the same
#     docker-bake.hcl `wheels` group and check-wheels.sh as the nightly)
#   - Source tarball from `make export`
#   - Full Docker image pushed to Docker Hub as rocm-aic:<tag> and rocm-aic:latest
#
# The wheels are built on the self-hosted SPUR runner, for the same reason the
# nightly is: they come out of the PyTorch + vLLM source builds, which overrun a
# GitHub-hosted runner's hard 6h job limit.
#
# KNOWN LIMITATION: the `Build + push Docker image` step below still builds the
# full multi-arch image on a GitHub-hosted runner and has the same problem.  It
# is untouched here -- moving the image push to SPUR is separate work.
#
# Secrets required:
#   CORP_CA_CERT      (optional) AMD Zscaler corp CA cert for BuildKit
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  for Docker Hub push
#   AIC_SPUR_HOST / AIC_SHARED_NFS        for the SPUR wheel build
#
name: rocm-aic - Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE_NAME: rocm-aic
  # ','-separated: this travels through ssh to the SPUR head node, where a ';'
  # would terminate the remote command.  Bake's rocm_arch_list() re-joins it
  # with ';' for the Dockerfiles; check-wheels.sh splits on either.
  ROCM_ARCH: 'gfx90a,gfx942,gfx950,gfx1151,gfx1201'

jobs:
  # ---------------------------------------------------------------------------
  # Wheels, on SPUR.  Same script and wheel-set check as the nightly.
  # ---------------------------------------------------------------------------
  wheels:
    name: Build release wheels on SPUR
    runs-on: [self-hosted, rocm-aic-cicd]
    timeout-minutes: 300
    env:
      AIC_SPUR_HOST: ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS: ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_BUILD_EXCLUDE_NODES: ${{ vars.AIC_BUILD_EXCLUDE_NODES }}
      AIC_WHEEL_OUT: ${{ github.workspace }}/wheels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build wheels on the SPUR head node
        run: |
          bash /usr/local/lib/aic-ci/spur-wheels-build.sh \
            "${{ github.sha }}" "${ROCM_ARCH}" release

      - name: Check the wheel set
        run: bash .github/scripts/workflows/check-wheels.sh "${AIC_WHEEL_OUT}" "${ROCM_ARCH}"

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheels
          path: ${{ env.AIC_WHEEL_OUT }}/
          retention-days: 7

  release:
    name: Build + publish release ${{ github.ref_name }}
    needs: wheels
    runs-on: ubuntu-24.04
    # GitHub hard-caps a hosted job at 360 minutes; the previous 420 could never
    # take effect.  The image build below is what needs this budget.
    timeout-minutes: 350
    permissions:
      contents: write   # create the versioned GitHub Release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # need full history so `make export` can resolve tags

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # AIC_VERSION is a required build-arg (the Dockerfile fails the build when
      # it is empty) and feeds the OCI version labels.  Same step as rocm-aic-docker-build.yml.
      - name: Read AIC version
        id: imgtag
        run: |
          set -euo pipefail
          aic_version="$(< VERSION)"
          : "${aic_version:?VERSION is missing or empty}"
          echo "aic_version=${aic_version}" >> "${GITHUB_OUTPUT}"

      # Corp CA cert (AMD Zscaler) as a BuildKit secret, only if set.
      # Never written into any image layer.  Same pattern as rocm-aic-docker-build.yml.
      - name: Write corp CA cert secret
        id: cert
        run: |
          if [ -n "${{ secrets.CORP_CA_CERT }}" ]; then
            echo "${{ secrets.CORP_CA_CERT }}" > /tmp/corp-ca.crt
            echo "path=/tmp/corp-ca.crt" >> "${GITHUB_OUTPUT}"
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      # ---------------------------------------------------------------------------
      # Collect the wheels the SPUR job built
      # ---------------------------------------------------------------------------
      - name: Download release wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wheels
          path: wheels

      # Re-check here, not just on the build node: this is the last point before
      # the wheels become public.
      - name: Check the wheel set
        run: bash .github/scripts/workflows/check-wheels.sh wheels "${ROCM_ARCH}"

      # ---------------------------------------------------------------------------
      # Build source tarball
      # ---------------------------------------------------------------------------
      - name: Build source tarball (make export)
        run: |
          set -euo pipefail
          make export
          tarball="$(ls aic-release-*.tar.gz 2>/dev/null | head -1)"
          [ -n "${tarball}" ] || { echo "ERROR: make export produced no tarball" >&2; exit 1; }
          echo "TARBALL=${tarball}" >> "${GITHUB_ENV}"
          echo "Source tarball: ${tarball} ($(du -h "${tarball}" | cut -f1))"

      # ---------------------------------------------------------------------------
      # Build + push full Docker image
      # ---------------------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/lmcache/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            ROCM_ARCH=${{ env.ROCM_ARCH }}
            AIC_VERSION=${{ steps.imgtag.outputs.aic_version }}
          secrets: |
            ${{ steps.cert.outputs.present == 'true' && format('tls_cert={0}', steps.cert.outputs.path) || '' }}
          cache-from: type=gha,scope=aic
          cache-to: type=gha,mode=max,scope=aic

      # ---------------------------------------------------------------------------
      # Compose release notes + publish
      # ---------------------------------------------------------------------------
      - name: Compose release notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/workflows/render-release-notes.sh \
            release \
            "${REF_NAME}" \
            "${{ github.sha }}" \
            "${ROCM_ARCH}" \
            wheels \
            "${GITHUB_REPOSITORY}" \
            "${IMAGE_NAME}" \
            > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_NAME}"
          gh release create "${tag}" wheels/*.whl "${TARBALL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AIC ${tag}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
          echo "Published release ${tag} at ${{ github.sha }}"
