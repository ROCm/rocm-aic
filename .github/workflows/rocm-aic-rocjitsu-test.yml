#
# GPU-stack integration test using rocjitsu vfio-user emulation.
# Boots an Ubuntu guest VM under QEMU-KVM with an emulated gfx1250 GPU
# (rocjitsu vfio-user server), builds the aic-vllm image for gfx1250,
# loads it into the guest, and asserts torch.cuda.is_available()==True
# with arch=gfx1250.  No physical GPU required; /dev/kvm is available on
# GitHub-hosted ubuntu-24.04 runners.
#
# Three different caches are in play here, deliberately on three different
# backends.  They are not interchangeable:
#
#   * The guest qcow2 disk -> actions/cache.  ~7 GB compressed, fits the 10 GB
#     per-entry limit, and is keyed on the image tag so a pin bump misses
#     cleanly.  ORAS pull is the fallback on a miss.
#   * The aic-* images -> GHCR, pulled whole by RJ_IMAGE_PREFIX.  Far too big
#     for actions/cache, and a registry gives the nightly publish job and this
#     job a shared handle (`:gfx1250`) without either knowing the 100-char
#     version tag.
#   * BuildKit layers -> GHCR registry cache (AIC_CACHE_REF), only consulted on
#     the fallback path where the images are missing and we build.
#
# Note what is NOT used: `type=gha` BuildKit cache.  GitHub's Actions cache is
# a ~10 GB REPO-WIDE quota with LRU eviction, so a ROCm layer cache pushed into
# it both fails to fit and evicts the qcow2 entry above, turning every run into
# a cold ORAS pull as well as a cold build.  Registry cache has no such quota.
#
# See mk/bench.mk test-rocjitsu-local.
name: rocm-aic - Rocjitsu VM Test

on:
  schedule:
    # 02:00 PST = 10:00 UTC (off-peak; runs after nightly dist-build)
    - cron: '0 10 * * *'
  # NOTE: pull_request trigger removed — the 60 GB image cannot be pulled on
  # standard ubuntu-24.04 GHA runners (~47 GB free after disk cleanup).
  # Run manually via workflow_dispatch or wait for the nightly schedule.
  # TODO: re-enable after multi-stage base Dockerfile reduces image to <40 GB.
  workflow_dispatch:
    inputs:
      rj_image_ref:
        description: >-
          Pre-built aic-vllm image ref to use instead of building locally
          (e.g. registry.example.com/aic-vllm:tag).  Leave blank to build.
        required: false
        default: ''

permissions:
  contents: read
  packages: write   # cache-to pushes BuildKit layer cache to GHCR

jobs:
  rocjitsu-test:
    name: Boot rocjitsu VM and verify gfx1250 GPU visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      ROCM_ARCH: gfx1250

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (runner pre-installed software)
        run: |
          # GHA ubuntu-24.04 runners ship with ~30 GB of pre-installed software
          # that the build doesn't need.  Remove it up front so the ROCm-based
          # Docker build layers have room to land.
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /usr/local/share/powershell \
                      /usr/share/swift /usr/local/.ghcup
          sudo apt-get purge -y --auto-remove \
            google-chrome-stable firefox dotnet-sdk-* \
            libgl1-mesa-dri mono-runtime* 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Verify KVM is available and functional
        run: |
          # QEMU runs inside the aic-rj-qemu container, which gets /dev/kvm via
          # `docker run --device /dev/kvm` and runs as uid 0.  The runner user's
          # own access to /dev/kvm is therefore irrelevant, which is why there is
          # no udev rule here: granting it needed root, and that made the job
          # unrunnable anywhere the user has no sudo (self-hosted and Slurm
          # nodes).  Verified on a Slurm node where /dev/kvm was unreadable to
          # the user and still read-write inside the container.
          #
          # So probe exactly where QEMU will: inside a container.  A device node
          # can exist and still be non-functional, so issue KVM_GET_API_VERSION
          # rather than just stat'ing it.
          test -c /dev/kvm || { echo "::error::/dev/kvm missing on the host"; exit 1; }
          docker run --rm --device /dev/kvm python:3.12-slim \
            python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0); print('KVM_GET_API_VERSION OK (uid', os.getuid(), ')')" \
            || { echo "::error::/dev/kvm not usable from a container"; exit 1; }

      - name: Install docker compose plugin
        run: make ensure-compose

      # Cache the rocjitsu qcow2 guest disk keyed on its image tag.
      # We pull via ORAS (the -qcow2 tagged zstd artifact) rather than docker
      # pull (which unpacks a 14 GB FROM-scratch image) because the compressed
      # artifact fits within the GHA 10 GB cache-entry limit.
      - name: Resolve qcow2 image tag for cache key
        id: qcow2-tag
        run: |
          TAG=$(grep '^RJ_QCOW2_IMAGE' mk/bench.mk | head -1 | sed 's/.*://;s/ .*//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Qcow2 tag: $TAG"

      - name: Cache rocjitsu guest disk (qcow2)
        id: qcow2-cache
        uses: actions/cache@v6
        with:
          path: /tmp/aic-rocjitsu-test/vm
          key: qcow2-${{ steps.qcow2-tag.outputs.tag }}

      - name: Pull rocjitsu guest disk via ORAS (cache miss)
        if: steps.qcow2-cache.outputs.cache-hit != 'true'
        run: |
          # Install ORAS if not present.  Into a user-writable dir on PATH,
          # not /usr/local/bin: that needed root, and nothing here requires a
          # system-wide install for a single job.
          if ! command -v oras >/dev/null 2>&1; then
            mkdir -p "${RUNNER_TEMP}/bin"
            curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
              | tar -xz -C "${RUNNER_TEMP}/bin" oras
            echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
            export PATH="${RUNNER_TEMP}/bin:$PATH"
          fi
          REPO="sbates130272/batesste-ci-images-ubuntu-qcow2-gen-rocjitsu"
          TAG="${{ steps.qcow2-tag.outputs.tag }}-qcow2"
          mkdir -p /tmp/aic-rocjitsu-test/vm
          cd /tmp/aic-rocjitsu-test/vm
          echo "Pulling $REPO:$TAG via ORAS..."
          oras pull "docker.io/$REPO:$TAG"
          # Decompress any .zst files
          for f in *.qcow2.zst; do
            [ -f "$f" ] && zstd -d --long=27 --rm "$f" && echo "Decompressed $f"
          done
          # Pull vm-info.json and SSH keys from the OCI referrer
          DIGEST=$(oras discover --format json "docker.io/$REPO:$TAG" \
            | python3 -c "import json,sys; refs=json.load(sys.stdin).get('referrers',[]); print(refs[0]['digest'] if refs else '')" 2>/dev/null || true)
          [ -n "$DIGEST" ] && oras pull "docker.io/$REPO@$DIGEST" && chmod 600 id_rsa 2>/dev/null || true
          ls -lh

      - name: Set up Docker Buildx (for layer-cached local builds)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          install: true

      - name: Log in to GHCR (read pre-built image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build the gfx1250 stack
        run: |
          # The test loads FIVE images into the guest (vllm, lmcache, hsa-snoop
          # and the two fabric exporters), not just aic-vllm.  Pulling one and
          # letting the make target discover the rest missing meant a 600 s
          # per-image tar wait followed by a compose failure, so the pull/build
          # decision belongs to the make target, which knows the whole list.
          #
          # RJ_IMAGE_PREFIX makes [2/6] pull each image and retag it to the bare
          # local name compose expects; it falls back to a local `make build`
          # (registry-cached) when the registry has no image to offer.
          SUPPLIED="${{ inputs.rj_image_ref }}"
          if [ -n "$SUPPLIED" ]; then
            echo "Using workflow_dispatch-supplied image: $SUPPLIED"
            docker pull "$SUPPLIED"
            # Name it exactly what [2/6] expects so it counts as already present.
            docker tag "$SUPPLIED" \
              "$(make --no-print-directory print-rj-image-ref ROCM_ARCH=gfx1250)"
          fi

      - name: Run rocjitsu VM test
        run: |
          # The vm/ dir is pre-populated from cache or the ORAS pull above, so
          # [3/6] skips its own extraction (vm-info.json present).
          #
          # RJ_IMAGE_REF is deliberately NOT overridden here.  It used to be set
          # from `docker inspect ... .RepoTags[0]`, which is whichever tag docker
          # happened to list first and need not be the arch-tagged name the rest
          # of the target (and compose inside the guest) derives from
          # _RJ_IMAGE_TAG.  Letting the Makefile name its own images keeps the
          # host-side save list and the guest-side compose refs in agreement.
          # RJ_PROBE_ONLY: assert everything up to and including real kernel
          # execution, and stop before vllm-reset-test.
          #
          # This is not avoidance, it is arithmetic.  The emulator runs at a
          # measured 0.14 GFLOP/s (job 68190190), so a 135M-parameter model
          # costs ~2 s per token of prefill.  vllm_reset_test.py is sized for
          # real hardware: 10 anchor prompts of ~3584 tokens each, plus 50
          # flood prompts, each capped by a 120 s per-request timeout.  A
          # single anchor prefill is ~115 minutes here and would blow that
          # timeout by two orders of magnitude; the full workload is many
          # hours.  Shrinking it does not rescue it either -- LMCache's
          # eviction semantics need multi-chunk prompts (chunk_size=256
          # tokens), so the prompts cannot go short enough to matter.
          #
          # What the probe arm does assert is substantial and runs in ~26 min:
          # the gfx1250 device enumerates, 15 kernel rungs execute correctly
          # (elementwise, reductions, GEMM, softmax, layernorm, SDPA, a Triton
          # JIT compile+launch, and memory accounting), and the whole compose
          # stack -- lmcache, coordinator, exporters, hsa-snoop -- comes up.
          #
          # Run the vLLM arm on a cluster node with a real budget instead:
          #   sbatch --export=ALL,RJ_MAKE_ARGS="RJ_READY_RETRIES=4000" \
          #          .slurm/run-rocjitsu-cpu.sbatch
          make test-rocjitsu-local \
            ROCM_ARCH=gfx1250 \
            RJ_IMAGE_PREFIX=ghcr.io/rocm/rocm-aic/ \
            AIC_CACHE_REF=ghcr.io/rocm/rocm-aic/aic-cache:gfx1250 \
            RJ_PROBE=1 RJ_PROBE_ONLY=1 \
            RJ_READY_S=240

      - name: Upload rocjitsu logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rocjitsu-logs
          path: /tmp/aic-rocjitsu-test/
          retention-days: 3
