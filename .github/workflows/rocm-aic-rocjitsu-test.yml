#
# GPU-stack integration test using rocjitsu vfio-user emulation.
# Boots an Ubuntu guest VM under QEMU-KVM with an emulated gfx1250 GPU
# (rocjitsu vfio-user server), builds the aic-vllm and aic-lmcache images
# for gfx1250, loads them into the guest, asserts torch.cuda.is_available()==True
# with arch=gfx1250, and runs vllm-reset-test there.  No physical GPU
# required; /dev/kvm is available on GitHub-hosted ubuntu-24.04 runners.
#
# The images are built through docker-bake.hcl, reading (not writing) the GHCR
# layer cache rocm-aic-publish-gfx1250-image.yml keeps warm, so a warm build
# mostly pulls layers; a cold one takes ~3-4 h.
#
# See mk/bench.mk test-rocjitsu-local.
name: rocm-aic - Rocjitsu VM Test

on:
  schedule:
    # 02:00 PST = 10:00 UTC (off-peak; runs after nightly dist-build)
    - cron: '0 10 * * *'
  # NOTE: pull_request trigger removed — the 60 GB image cannot be pulled on
  # standard ubuntu-24.04 GHA runners (~47 GB free after disk cleanup).
  # Run manually via workflow_dispatch or wait for the nightly schedule.
  # TODO: re-enable after multi-stage base Dockerfile reduces image to <40 GB.
  workflow_dispatch:
    inputs:
      rj_image_ref:
        description: >-
          Pre-built aic-vllm image ref to use instead of building locally
          (e.g. registry.example.com/aic-vllm:tag).  Leave blank to build.
        required: false
        default: ''

permissions:
  contents: read
  packages: read   # read the publisher's layer cache from GHCR

jobs:
  rocjitsu-test:
    name: Boot rocjitsu VM and verify gfx1250 GPU visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      ROCM_ARCH: gfx1250

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (runner pre-installed software)
        run: |
          # GHA ubuntu-24.04 runners ship with ~30 GB of pre-installed software
          # that the build doesn't need.  Remove it up front so the ROCm-based
          # Docker build layers have room to land.
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /usr/local/share/powershell \
                      /usr/share/swift /usr/local/.ghcup
          sudo apt-get purge -y --auto-remove \
            google-chrome-stable firefox dotnet-sdk-* \
            libgl1-mesa-dri mono-runtime* 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Enable KVM access for runner user
        run: |
          # GHA ubuntu-24.04 runners have /dev/kvm but the runner user lacks
          # write access by default.  Open it up for the duration of this job.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Verify KVM is available and functional
        run: |
          test -c /dev/kvm || { echo "::error::/dev/kvm missing"; exit 1; }
          test -r /dev/kvm && test -w /dev/kvm \
            || { echo "::error::/dev/kvm not read-write after udev rule"; exit 1; }
          # KVM_GET_API_VERSION ioctl — a bind-mounted node can exist and still
          # be non-functional; this proves the hypervisor is actually present.
          python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0)" \
            || { echo "::error::/dev/kvm present but KVM_GET_API_VERSION failed"; exit 1; }
          echo "KVM available: $(ls -l /dev/kvm)"

      - name: Install docker compose plugin
        run: make ensure-compose

      # Cache the rocjitsu qcow2 guest disk keyed on its image tag.
      # We pull via ORAS (the -qcow2 tagged zstd artifact) rather than docker
      # pull (which unpacks a 14 GB FROM-scratch image) because the compressed
      # artifact fits within the GHA 10 GB cache-entry limit.
      - name: Resolve qcow2 image tag for cache key
        id: qcow2-tag
        run: |
          TAG=$(grep '^RJ_QCOW2_IMAGE' mk/bench.mk | head -1 | sed 's/.*://;s/ .*//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Qcow2 tag: $TAG"

      - name: Cache rocjitsu guest disk (qcow2)
        id: qcow2-cache
        uses: actions/cache@v6
        with:
          path: /tmp/aic-rocjitsu-test/vm
          key: qcow2-${{ steps.qcow2-tag.outputs.tag }}

      - name: Pull rocjitsu guest disk via ORAS (cache miss)
        if: steps.qcow2-cache.outputs.cache-hit != 'true'
        run: |
          # Install ORAS if not present
          which oras 2>/dev/null || {
            curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin oras
          }
          REPO="sbates130272/batesste-ci-images-ubuntu-qcow2-gen-rocjitsu"
          TAG="${{ steps.qcow2-tag.outputs.tag }}-qcow2"
          mkdir -p /tmp/aic-rocjitsu-test/vm
          cd /tmp/aic-rocjitsu-test/vm
          echo "Pulling $REPO:$TAG via ORAS..."
          oras pull "docker.io/$REPO:$TAG"
          # Decompress any .zst files
          for f in *.qcow2.zst; do
            [ -f "$f" ] && zstd -d --long=27 --rm "$f" && echo "Decompressed $f"
          done
          # Pull vm-info.json and SSH keys from the OCI referrer
          DIGEST=$(oras discover --format json "docker.io/$REPO:$TAG" \
            | python3 -c "import json,sys; refs=json.load(sys.stdin).get('referrers',[]); print(refs[0]['digest'] if refs else '')" 2>/dev/null || true)
          [ -n "$DIGEST" ] && oras pull "docker.io/$REPO@$DIGEST" && chmod 600 id_rsa 2>/dev/null || true
          ls -lh

      - name: Set up Docker Buildx (for layer-cached local builds)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          install: true

      - name: Log in to GHCR (read the layer cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every locally built image the guest's vllm-reset-test runs (its
      # monitoring profile includes hsa-snoop and the fabric exporters).  Bake
      # tags them exactly as test-rocjitsu-local expects (from ROCM_ARCH=gfx1250
      # above), so the make target reuses them instead of running `make build`.
      - name: Build the gfx1250 images the VM test runs
        env:
          SUPPLIED: ${{ inputs.rj_image_ref }}
          GHCR_BASE: ghcr.io/rocm/rocm-aic/aic-base
          GHCR_VLLM: ghcr.io/rocm/rocm-aic/aic-vllm
          GHCR_LMCACHE: ghcr.io/rocm/rocm-aic/aic-lmcache
        run: |
          set -euo pipefail
          targets=(lmcache vllm hsa-snoop nvme-exporter rdma-exporter)
          if [ -n "$SUPPLIED" ]; then
            echo "Using workflow_dispatch-supplied aic-vllm image: $SUPPLIED"
            docker pull "$SUPPLIED"
            targets=(lmcache hsa-snoop nvme-exporter rdma-exporter)
          fi
          # lmcache's heavy stages are lmcache-wheels', which the publisher
          # caches; its runtime stage on top is pip installs.  hsa-snoop and the
          # exporters are small builds with no cache here.
          AIC_VERSION="$(cat VERSION)" docker buildx bake -f docker/docker-bake.hcl \
            --progress=plain \
            --set "base.output=type=cacheonly" \
            --set "base.cache-from=type=registry,ref=${GHCR_BASE}-cache:gfx1250" \
            --set "lmcache-wheels.cache-from=type=registry,ref=${GHCR_LMCACHE}-cache:gfx1250" \
            --set "lmcache.output=type=docker" \
            --set "lmcache.cache-from=type=registry,ref=${GHCR_LMCACHE}-cache:gfx1250" \
            --set "vllm.output=type=docker" \
            --set "vllm.cache-from=type=registry,ref=${GHCR_VLLM}-cache:gfx1250" \
            --set "hsa-snoop.output=type=docker" \
            --set "nvme-exporter.output=type=docker" \
            --set "rdma-exporter.output=type=docker" \
            "${targets[@]}"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' \
            | grep -E '^aic-(vllm|lmcache|hsa-snoop|nvme-exporter|rdma-exporter):'
          df -h /

      - name: Run rocjitsu VM test
        env:
          HF_TOKEN: ${{ secrets.AIC_HF_TOKEN }}
          SUPPLIED: ${{ inputs.rj_image_ref }}
        run: |
          # The vm/ dir is pre-populated from cache or ORAS pull so the
          # make target will skip its own extraction step (vm-info.json present).
          make test-rocjitsu-local \
            ${SUPPLIED:+RJ_IMAGE_REF="$SUPPLIED"} \
            RJ_READY_S=240

      - name: Upload rocjitsu logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rocjitsu-logs
          path: /tmp/aic-rocjitsu-test/
          retention-days: 3
