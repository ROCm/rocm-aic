name: AIC Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find . -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -print0 | xargs -0 -I{} shellcheck -x {}

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

  htmlhint:
    name: HTMLHint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install htmlhint
        run: npm install -g htmlhint
      - name: Run htmlhint
        run: htmlhint '.github/pages/*.html'

  validate-profile-packs:
    name: Validate LLM-Emu profile packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve LLM-Emu ref from Dockerfile
        id: meta
        run: |
          ref="$(grep -E '^ARG LLM_EMU_REF=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          url="$(grep -E '^ARG LLM_EMU_GIT_URL=' docker/Dockerfile | head -1 | cut -d= -f2-)"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
      - name: Install vllm_emulator plugin (no deps — no torch needed)
        run: |
          set -euo pipefail
          git clone "${{ steps.meta.outputs.url }}" /tmp/llm-emu
          git -C /tmp/llm-emu checkout "${{ steps.meta.outputs.ref }}"
          for p in patches/llm-emu/*.patch; do git -C /tmp/llm-emu apply "$p"; done
          pip install --quiet --no-deps /tmp/llm-emu
      - name: Run profile pack validator
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.github/scripts/validate-profile-packs.py"

  grafana-dashboard-lint:
    name: Grafana dashboard lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dashboard-linter
        run: |
          set -euo pipefail
          version="0.2.0"
          url="https://github.com/grafana/dashboard-linter/releases/download/v${version}/dashboard-linter_${version}_linux_amd64.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin dashboard-linter
          dashboard-linter lint --help > /dev/null
      - name: Lint AIC Overview dashboard
        run: |
          set -euo pipefail
          # Rules disabled in .linter-config.yaml:
          #   template-job-rule / target-job-rule: fixed job names per scrape
          #     target; a $job dropdown would break all panel queries.
          #   template-instance-rule / target-instance-rule: same — AIC-specific.
          #   target-counter-agg-rule: summary row shows cumulative totals via
          #     max_over_time(), not rate() — intentional design.
          # Run linter and fail only on findings not in our exclusion list.
          # dashboard-linter v0.2.0 does not honour 'disabled: true' for all
          # rules in --strict mode, so we filter the output manually.
          out=$(dashboard-linter lint \
            --config monitoring/grafana/.linter-config.yaml \
            monitoring/grafana/dashboards/aic-overview.json 2>&1)
          echo "$out"
          # Fail if any ❌ lines remain after removing excluded rule output.
          echo "$out" | grep '❌' \
            | grep -v 'instance selector\|job selector' \
            | grep -v 'missing the instance\|missing the job' \
            | grep -v 'counter metric.*is not aggregated' \
            && exit 1 || exit 0
