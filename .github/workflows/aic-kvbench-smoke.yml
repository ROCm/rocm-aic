#
# CPU-only validation for the cliff harness's KVBench arm on a GitHub-hosted
# runner. Pulls KVBench from its upstream repository at a pinned commit, starts
# the real CPU-only server, and drives it through the cliff harness without
# requiring GPUs, Docker, or SPUR capacity.

name: AIC KVBench Arm Smoke

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'benchmarks/**'
      - 'tests/**'
      - '.github/workflows/aic-kvbench-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'benchmarks/**'
      - 'tests/**'
      - '.github/workflows/aic-kvbench-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KVBENCH_GIT_URL: https://github.com/wvaske/llm-kv-passthrough.git
  KVBENCH_REF: 177cf4e7c46ece8e03a701f89b60cd3a329f45fd

jobs:
  kvbench-arm-smoke:
    name: KVBench cliff arm smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Run targeted cliff unit tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_run_cliff

      - name: Install KVBench from upstream
        run: |
          set -euo pipefail
          git clone --depth 1 "${KVBENCH_GIT_URL}" /tmp/kvbench
          git -C /tmp/kvbench fetch --depth 1 origin "${KVBENCH_REF}"
          git -C /tmp/kvbench checkout "${KVBENCH_REF}"
          python -m pip install '/tmp/kvbench[lmcache]'

      - name: Smoke-test the KVBench cliff arm
        run: |
          set -euo pipefail

          cat > /tmp/lmcache.yaml <<'YML'
          chunk_size: 256
          local_cpu: true
          max_local_cpu_size: 0.25
          YML

          kvbench serve \
            --model llama-3.1-8b \
            --gpu H100_SXM \
            --host 127.0.0.1 \
            --port 18000 \
            --lmcache-config /tmp/lmcache.yaml \
            >/tmp/kvbench-smoke.log 2>&1 &
          srv_pid=$!
          export SRV_PID="${srv_pid}"
          trap 'python -c "import os, signal; os.kill(int(os.environ[\"SRV_PID\"]), signal.SIGTERM)"' EXIT

          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 10
          while True:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18000/v1/models", timeout=1) as resp:
                      if resp.status == 200:
                          break
              except Exception:
                  if time.time() >= deadline:
                      raise
                  time.sleep(0.2)
          PY

          python /home/runner/work/rocm-aic/rocm-aic/benchmarks/run_cliff.py \
            --endpoint http://127.0.0.1:18000 \
            --model llama-3.1-8b \
            --arm kvbench \
            --isl 32 \
            --shared-prefix-tokens 16 \
            --concurrencies 1,2 \
            --iters 1 \
            --warmup-iters 0 \
            --request-timeout 10 \
            --out /tmp/kvbench-cliff.csv

          python - <<'PY'
          import csv

          with open("/tmp/kvbench-cliff.csv", newline="") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 2, rows
          assert {row["arm"] for row in rows} == {"kvbench"}, rows
          for row in rows:
              assert row["ok_count"] == row["concurrency"], row
              assert row["err_count"] == "0", row
              assert row["l1_cache_queries"] == "", row
              assert row["ext_cache_queries"] == "", row
          PY
