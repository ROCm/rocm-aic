#
# CPU-only validation for the cliff harness's KVBench arm on a GitHub-hosted
# runner. Builds the repo's KVBench container, starts it on the compose network,
# and drives it through the cliff harness without requiring GPUs or SPUR capacity.

name: AIC KVBench Arm Smoke

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'benchmarks/**'
      - 'docker/**'
      - 'tests/**'
      - '.github/workflows/aic-kvbench-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'benchmarks/**'
      - 'docker/**'
      - 'tests/**'
      - '.github/workflows/aic-kvbench-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kvbench-arm-smoke:
    name: KVBench cliff arm smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Run targeted cliff unit tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_run_cliff

      - name: Start containerized KVBench
        run: |
          set -euo pipefail
          make kvbench-up KVBENCH_LOCAL_CPU_SIZE_GB=0.25

      - name: Smoke-test the KVBench compose path
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 120
          while True:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18000/v1/models", timeout=1) as resp:
                      if resp.status == 200:
                          break
              except Exception:
                  if time.time() >= deadline:
                      raise
                  time.sleep(0.2)
          PY

          for _ in $(seq 1 60); do
            if docker exec aic-client python -c 'import openai' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec aic-client python3 -u benchmarks/run_cliff.py \
            --endpoint http://aic-kvbench:8000 \
            --model llama-3.1-8b \
            --arm kvbench \
            --isl 32 \
            --shared-prefix-tokens 16 \
            --concurrencies 1,2 \
            --iters 1 \
            --warmup-iters 0 \
            --request-timeout 10 \
            --out /logs/kvbench-cliff.csv

          python - <<'PY'
          import csv

          with open("/home/runner/work/rocm-aic/rocm-aic/logs/kvbench-cliff.csv", newline="") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 2, rows
          assert {row["arm"] for row in rows} == {"kvbench"}, rows
          for row in rows:
              assert row["ok_count"] == row["concurrency"], row
              assert row["err_count"] == "0", row
              assert row["l1_cache_queries"] == "", row
              assert row["ext_cache_queries"] == "", row
          PY

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f /home/runner/work/rocm-aic/rocm-aic/docker/docker-compose.yml --profile kvbench logs --no-color kvbench client

      - name: Tear down KVBench compose profile
        if: always()
        run: make kvbench-down
