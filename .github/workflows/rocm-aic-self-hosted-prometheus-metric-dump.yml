#
# Prometheus Metric Dump — runs `make prometheus-dump` on a SPUR GPU node,
# scrapes all /metrics endpoints from the full compose MP stack (vLLM +
# LMCache + coordinator + exporters), and generates a Markdown metrics
# reference document via monitoring/scripts/metrics_to_md.py.
#
# On success the Markdown file is deployed to the gh-pages branch so it is
# served at https://rocm.github.io/rocm-aic/prometheus/.
#
# Requires (all already in use by sibling nightly workflows):
#   secrets.AIC_SPUR_HOST        — SSH target for the SPUR head node
#   secrets.AIC_SHARED_NFS       — shared NFS path for image tarballs + scratch
#   secrets.AIC_SPUR_CONTROLLER  — SPUR controller address
#
# One-time repo setup: Settings → Pages → Source: gh-pages branch, / (root).
# The page will be served at https://rocm.github.io/rocm-aic/prometheus/.

name: rocm-aic - Self Hosted - Prometheus Metric Dump

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["rocm-aic - Self Hosted - Nightly Dist Build"]
    types: [completed]

permissions:
  contents: write   # required to push the gh-pages branch

jobs:
  prometheus-dump:
    name: Prometheus metric dump + publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, rocm-aic-cicd]
    timeout-minutes: 60
    env:
      AIC_SPUR_HOST:       ${{ secrets.AIC_SPUR_HOST }}
      AIC_SHARED_NFS:      ${{ secrets.AIC_SHARED_NFS }}
      AIC_CI_STORAGE_ROOT: ${{ secrets.AIC_SHARED_NFS }}/rocm-aic
      AIC_SPUR_CONTROLLER: ${{ secrets.AIC_SPUR_CONTROLLER }}

    steps:
      - uses: actions/checkout@v5

      - name: Run prometheus-dump on SPUR
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          bash .github/scripts/workflows/spur-prometheus-dump.sh "${SHA}"

      - name: Upload prometheus-dump artifact
        uses: actions/upload-artifact@v6
        with:
          name: prometheus-dump-${{ github.sha }}
          path: prometheus-page/
          if-no-files-found: error
          retention-days: 30

      - name: Deploy prometheus-dump to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prometheus-page
          destination_dir: prometheus
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
