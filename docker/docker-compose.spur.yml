# SPUR cluster compose override.
#
# spur-authz blocks:
#   B1: /:/host bind-mount (node-exporter rootfs)
#
# Workarounds:
#   node-exporter  -- replace /:/host with a tmpfs so the container starts;
#                     CPU/mem/net metrics still come from /proc+/sys inside the
#                     container, disk/fs metrics are absent.
#
# alloy, hsa-snoop and nvme-exporter are not overridden here: no override can
# satisfy spur-authz for them, so monitoring-lib.sh leaves them out of the
# `compose up` instead.  An override could not drop nvme-exporter's /dev:/dev
# bind anyway, since compose merges volumes by target path.
#
# Applied automatically by monitoring-lib.sh when AIC_SPUR_CLUSTER=1.

services:
  node-exporter:
    volumes:
      - type: tmpfs
        target: /host
      - aic-prom-textfile:/prom:ro
    command:
      - --collector.diskstats
      - --collector.nvme
      - --collector.infiniband
      - --collector.textfile.directory=/prom
      - --web.listen-address=:9100

  # hsa-snoop is never started on SPUR, but `compose config` still validates it,
  # and its default pid (service:lmcache) fails validation when lmcache is not
  # in the active profiles.  pid:host is blocked by spur-authz, so point it at
  # prometheus, which is always active.
  hsa-snoop:
    pid: "service:prometheus"
