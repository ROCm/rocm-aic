#
# Five-container inference stack (single compose file).
#
#   coordinator — LMCache MP coordinator and fleet-wide key directory (:9300)
#                 Receives registration, heartbeats, and cache placement events.
#
#   lmcache / lmcache2 — two standalone lmcache-server instances (MP mode)
#               Each owns a distinct GPU, ZMQ/HTTP/telemetry port set, stable
#               coordinator instance ID, and storage namespace.  Both register
#               with the coordinator above and report cache placement events to
#               its fleet-wide key directory.
#
#               Standard mode (GDS_MODE unset):
#                 L1:  GPU/CPU DRAM (--l1-size-gb)
#                 L2a: nixl_store AIS_MT → local NVMe at NVME_DATA (hipFile P2PDMA)
#                 L2b: nixl_store POSIX  → NFS-over-RDMA (host pre-mounted)
#               GDS L1 mode (GDS_MODE=1):
#                 L1:  NVMe slab at GDS_SLAB_DATA (hipFile on ROCm, cuFile on NVIDIA — auto-detected)
#               local_disk L2 (AIC_L2_BACKEND=local_disk):
#                 L1:  DRAM (--l1-size-gb) + native LocalDiskBackend L2 via LMCACHE_CONFIG_FILE
#
#   vllm / vllm2 — two vllm serve instances, one paired with each LMCache server
#               KV_TRANSFER_ARG / KV_TRANSFER_ARG_2 select the connectors. Set them to the
#               LMCacheMPConnector JSON (default via `make up`) to connect to the
#               corresponding lmcache service over ZMQ, or leave it EMPTY for a plain
#               VRAM-prefix-cache-only vLLM (the cliff `vram` baseline arm).
#
# This one compose file is the single source of truth for every launch path:
#   make up / up-gds-l1                — interactive MP stack
#   .slurm/run-cliff.sbatch            — all cliff arms (vram baseline + nvme + gds)
#   .slurm/run-build-distribute.sh     — tiny-test end-to-end serve
#
# The lmcache service sits behind the `cache` compose profile, so the plain
# `vram` baseline can start `vllm` alone (`docker compose up vllm`) without
# pulling in lmcache — vllm's depends_on uses `required: false` for that.
#
# Required env:
#   ROCM_ARCH      — e.g. gfx942
#   HF_TOKEN       — HuggingFace access token
#   NVME_DATA      — host path to local NVMe mount (L2a AIS_MT pool; e.g. /mnt/lmcache-nvme)
#   NFS_DATA       — host path to NFS-over-RDMA mount (L2b; e.g. /mnt/lmcache-nfs)
#
# Optional:
#   GPU / GPU2             — ROCR_VISIBLE_DEVICES for each vllm/lmcache pair (defaults: 0 / 1)
#   GDS_MODE               — set to 1 to enable hipFile NVMe slab as L1 (requires GDS_SLAB_DATA)
#   GDS_SLAB_DATA / GDS_SLAB_DATA_2 — separate hipFile slab paths (required when GDS_MODE=1)
#   AIC_L2_BACKEND         — nixl (default AIS_MT + POSIX L2), local_disk (native
#                            LocalDiskBackend via LMCACHE_CONFIG_FILE), or none (DRAM-only L1)
#   LMCACHE_CONFIG_FILE_HOST / LMCACHE_CONFIG_FILE_HOST_2 — per-server LMCache YAML configs
#   KV_TRANSFER_ARG / KV_TRANSFER_ARG_2 — per-vLLM --kv-transfer-config args
#   HF_HOME                — host HF cache dir (default: ~/.cache/huggingface)
#   LOG                    — host log dir (default: ../logs, i.e. /logs)
#   IMAGE_NAME             — Docker image tag (default: rocm-aic)
#   VLLM_MODEL             — model to serve
#   LMCACHE_PORT / LMCACHE_PORT_2 — lmcache ZMQ listen ports (defaults: 6555 / 6556)
#   LMCACHE_HTTP_PORT / LMCACHE_HTTP_PORT_2 — lmcache HTTP ports (defaults: 8080 / 8081)
#   LMCACHE_INSTANCE_ID / LMCACHE_INSTANCE_ID_2 — coordinator identities (lmcache-1 / lmcache-2)
#   LMCACHE_STORAGE_NAMESPACE / LMCACHE_STORAGE_NAMESPACE_2 — L2 file prefixes
#   LMCACHE_L1_SIZE_GB     — L1 cap in GiB (DRAM mode) or slab size (GDS mode, default: 20)
#   LMCACHE_CHUNK_SIZE     — LMCache/coordinator token chunk size (default: 256)
#   LMCACHE_COORDINATOR_PORT — coordinator HTTP port (default: 9300)
#   LMCACHE_COORDINATOR_URL  — URL used by the MP server (default: http://127.0.0.1:9300)
#   LMCACHE_COORDINATOR_EVENT_FLUSH_INTERVAL — cache event flush interval (default: 1.0s)
#   LMCACHE_NVME_POOL      — nixl pool slots for NVMe adapter (default: 4096)
#   LMCACHE_NVME_SLOT_SIZE — nixl file size per slot in bytes (default: 256 MiB)
#   LMCACHE_NFS_POOL       — nixl pool slots for NFS adapter (default: 1024)
#   LMCACHE_NFS_SLOT_SIZE  — nixl file size per NFS slot in bytes (default: NVMe slot size)
#   AIC_NIXL_USE_DIRECT_IO — O_DIRECT for the AIS_MT NVMe L2 (default: true)
#   NIXL_METRICS_PORT / NIXL_METRICS_PORT_2 — NIXL telemetry ports (19090 / 19091)
#   VLLM_PORT / VLLM_PORT_2 — OpenAI API ports (8000 / 8001)
#   VLM_GPU_MEMORY_UTILIZATION — vllm --gpu-memory-utilization (default: 0.90)
#   VLM_MAX_MODEL_LEN          — vllm --max-model-len (default: 32768)
#   VLM_MAX_NUM_BATCHED_TOKENS — vllm --max-num-batched-tokens (default: 4096)
#   VLM_ATTENTION_BACKEND      — vllm --attention-backend (default: TRITON_ATTN)
#   VLM_KV_CACHE_DTYPE         — vllm --kv-cache-dtype (default: fp8)
#   VLLM_EXTRA_ARGS            — extra vllm args appended verbatim (e.g. --hf-overrides ...)
#   TENSOR_PARALLEL_SIZE       — vllm --tensor-parallel-size (default: 1)

services:

  # ---------------------------------------------------------------------------
  # coordinator: LMCache MP control plane and fleet-wide key directory.
  # Runs without GPU access. Host networking lets colocated MP servers use
  # 127.0.0.1 while preserving the existing host-networked stack.
  # ---------------------------------------------------------------------------
  coordinator:
    profiles:
      - cache
    image: ${IMAGE_NAME:-rocm-aic}
    container_name: aic-lmcache-coordinator
    network_mode: host
    environment:
      - LMCACHE_COORDINATOR_PORT=${LMCACHE_COORDINATOR_PORT:-9300}
      - LMCACHE_CHUNK_SIZE=${LMCACHE_CHUNK_SIZE:-256}
      - TZ=${TZ:-America/Edmonton}
    entrypoint: ["/usr/local/bin/lmcache", "coordinator"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "${LMCACHE_COORDINATOR_PORT:-9300}"
      - --chunk-size
      - "${LMCACHE_CHUNK_SIZE:-256}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.getenv('LMCACHE_COORDINATOR_PORT', '9300'), timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # lmcache: standalone LMCache server in MP mode
  # Selects between DRAM L1 + AIS_MT/NFS L2 (default), GDS NVMe slab L1
  # (GDS_MODE=1), and native LocalDiskBackend L2 (AIC_L2_BACKEND=local_disk).
  # Behind the `cache` profile so the plain vram baseline can skip it.
  # ---------------------------------------------------------------------------
  lmcache:
    profiles:
      - cache
    build:
      # Compose lives in docker/; the build context is the  tree
      # root (one level up) so the Dockerfile's COPY scripts/ patches/ benchmarks/
      # monitoring/ paths still resolve.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROCM_ARCH: ${ROCM_ARCH}
        BUILD_JOBS: ${BUILD_JOBS:-}
        AIC_UCX_FAST: ${AIC_UCX_FAST:-}
    image: ${IMAGE_NAME:-rocm-aic}
    container_name: aic-lmcache
    depends_on:
      coordinator:
        condition: service_healthy
    # Cross-container HIP IPC (LMCacheMPConnector registering vLLM's KV tensors) on
    # ROCm requires the two containers to share host networking + host IPC + a PID
    # namespace.  lmcache owns its (default) PID namespace here; the vllm service
    # JOINS it via `pid: service:lmcache` (see below) rather than both using host
    # PID -- host PID makes `docker rm` hang on teardown, container-shared does not.
    # A bridge network fails IPC (hipErrorInvalidContext); host net is required.
    # Ports exposed on the host: ZMQ ${LMCACHE_PORT:-6555}, HTTP
    # ${LMCACHE_HTTP_PORT:-8080}, NIXL telemetry ${NIXL_METRICS_PORT:-19090}.
    network_mode: host
    ipc: host
    cap_add:
      - CAP_SYS_ADMIN
      - SYS_PTRACE
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined
    ulimits:
      # NIXL opens one FD per pool slot at init; keep above pool sizes.
      nofile:
        soft: 1048576
        hard: 1048576
      # hipFileBufRegister pins the registered staging buffer; needs unlimited memlock.
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      # L2a NVMe — AIS_MT pool files (standard mode)
      - ${NVME_DATA:-/mnt/lmcache-nvme}:/data/nvme
      # L2b NFS — POSIX pool files (standard mode)
      - ${NFS_DATA:-/mnt/lmcache-nfs}:/data/nfs
      # GDS L1 slab (GDS_MODE=1 only; mount is harmless when GDS_MODE is unset)
      - ${GDS_SLAB_DATA:-/tmp/gds-slab-unused}:/data/slab
      # Optional LMCache YAML config (local_disk / advanced tuning).  Defaults to a
      # harmless mount; only read when LMCACHE_CONFIG_FILE is set in the environment.
      - ${LMCACHE_CONFIG_FILE_HOST:-/dev/null}:/config/lmcache.yml:ro
      # Kernel interfaces for hipFile KFD GPUDirect fastpath (GDS L1 mode)
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /boot:/boot:ro
      - ${LOG:-../logs}/lmcache:/var/log/aic-lmcache
    environment:
      - LMCACHE_PORT=${LMCACHE_PORT:-6555}
      - LMCACHE_HTTP_PORT=${LMCACHE_HTTP_PORT:-8080}
      - LMCACHE_INSTANCE_ID=${LMCACHE_INSTANCE_ID:-lmcache-1}
      - LMCACHE_STORAGE_NAMESPACE=${LMCACHE_STORAGE_NAMESPACE:-lmcache-1}
      - LMCACHE_L1_SIZE_GB=${LMCACHE_L1_SIZE_GB:-20}
      - LMCACHE_CHUNK_SIZE=${LMCACHE_CHUNK_SIZE:-256}
      - LMCACHE_COORDINATOR_URL=${LMCACHE_COORDINATOR_URL:-http://127.0.0.1:9300}
      - LMCACHE_COORDINATOR_EVENT_FLUSH_INTERVAL=${LMCACHE_COORDINATOR_EVENT_FLUSH_INTERVAL:-1.0}
      - GDS_MODE=${GDS_MODE:-}
      - GDS_SLAB_DATA=${GDS_SLAB_DATA:-}
      - AIC_L2_BACKEND=${AIC_L2_BACKEND:-nixl}
      - LMCACHE_NVME_POOL=${LMCACHE_NVME_POOL:-4096}
      - LMCACHE_NVME_SLOT_SIZE=${LMCACHE_NVME_SLOT_SIZE:-268435456}
      - LMCACHE_NFS_POOL=${LMCACHE_NFS_POOL:-1024}
      - LMCACHE_NFS_SLOT_SIZE=${LMCACHE_NFS_SLOT_SIZE:-268435456}
      - AIC_NIXL_USE_DIRECT_IO=${AIC_NIXL_USE_DIRECT_IO:-true}
      # Only set when a real config file is mounted (local_disk / advanced tuning).
      - LMCACHE_CONFIG_FILE=${LMCACHE_CONFIG_FILE:-}
      - HIPFILE_ALLOW_COMPAT_MODE=false
      - HIPFILE_UNSUPPORTED_FILE_SYSTEMS=true
      # NIXL native Prometheus telemetry exporter (serves /metrics on :19090).
      # Requires the prometheus-cpp plugin compiled into the image (build-nixl.sh);
      # a no-op fallback if absent.  Set NIXL_TELEMETRY_ENABLE= to disable.
      - NIXL_TELEMETRY_ENABLE=${NIXL_TELEMETRY_ENABLE-y}
      - NIXL_TELEMETRY_EXPORTER=${NIXL_TELEMETRY_EXPORTER:-prometheus}
      - NIXL_TELEMETRY_PROMETHEUS_PORT=${NIXL_METRICS_PORT:-19090}
      # Must share the SAME GPU as the vllm service: LMCacheMPConnector registers
      # vLLM's KV tensors via CUDA IPC, which fails ("invalid device pointer") if
      # lmcache lands on a different device.  Mirror vllm's ROCR_VISIBLE_DEVICES.
      - ROCR_VISIBLE_DEVICES=${GPU:-0}
      - PYTHONHASHSEED=0
    # The entrypoint script selects the L1/L2 topology from GDS_MODE +
    # AIC_L2_BACKEND.  local_disk relies on LMCACHE_CONFIG_FILE (mounted above).
    entrypoint: ["/bin/bash", "-o", "pipefail", "-c"]
    command:
      - |
        if [ "${GDS_MODE:-0}" = "1" ]; then
          exec lmcache server \
            --no-separate-object-groups \
            --host 0.0.0.0 \
            --port "$$LMCACHE_PORT" \
            --http-port "$$LMCACHE_HTTP_PORT" \
            --instance-id "$$LMCACHE_INSTANCE_ID" \
            --chunk-size "$$LMCACHE_CHUNK_SIZE" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --coordinator-url "$$LMCACHE_COORDINATOR_URL" \
            --coordinator-event-reporting \
            --coordinator-event-flush-interval "$$LMCACHE_COORDINATOR_EVENT_FLUSH_INTERVAL" \
            --gds-l1-path /data/slab
        elif [ "$$AIC_L2_BACKEND" = "local_disk" ] || [ "$$AIC_L2_BACKEND" = "none" ]; then
          # DRAM L1 only on the CLI.  local_disk adds a native LocalDiskBackend L2
          # via the mounted LMCACHE_CONFIG_FILE; none = pure DRAM (the minimal MP
          # config -- used by tiny-test and DRAM-only deployments).
          exec lmcache server \
            --no-separate-object-groups \
            --host 0.0.0.0 \
            --port "$$LMCACHE_PORT" \
            --http-port "$$LMCACHE_HTTP_PORT" \
            --instance-id "$$LMCACHE_INSTANCE_ID" \
            --chunk-size "$$LMCACHE_CHUNK_SIZE" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --coordinator-url "$$LMCACHE_COORDINATOR_URL" \
            --coordinator-event-reporting \
            --coordinator-event-flush-interval "$$LMCACHE_COORDINATOR_EVENT_FLUSH_INTERVAL"
        else
          # nixl AIS_MT NVMe L2a + POSIX NFS L2b.  Both are file-based nixl_store
          # backends, so both backend_params MUST include use_direct_io (LMCache
          # rejects the adapter otherwise); POSIX/NFS uses buffered I/O (false).
          exec lmcache server \
            --no-separate-object-groups \
            --host 0.0.0.0 \
            --port "$$LMCACHE_PORT" \
            --http-port "$$LMCACHE_HTTP_PORT" \
            --instance-id "$$LMCACHE_INSTANCE_ID" \
            --chunk-size "$$LMCACHE_CHUNK_SIZE" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --coordinator-url "$$LMCACHE_COORDINATOR_URL" \
            --coordinator-event-reporting \
            --coordinator-event-flush-interval "$$LMCACHE_COORDINATOR_EVENT_FLUSH_INTERVAL" \
            --l2-adapter "{\"type\":\"nixl_store\",\"backend\":\"AIS_MT\",\"backend_params\":{\"file_path\":\"/data/nvme/$$LMCACHE_STORAGE_NAMESPACE\",\"use_direct_io\":\"$$AIC_NIXL_USE_DIRECT_IO\",\"file_size\":\"$$LMCACHE_NVME_SLOT_SIZE\"},\"pool_size\":$$LMCACHE_NVME_POOL}" \
            --l2-adapter "{\"type\":\"nixl_store\",\"backend\":\"POSIX\",\"backend_params\":{\"file_path\":\"/data/nfs/$$LMCACHE_STORAGE_NAMESPACE\",\"use_direct_io\":\"false\",\"file_size\":\"$$LMCACHE_NFS_SLOT_SIZE\"},\"pool_size\":$$LMCACHE_NFS_POOL}"
        fi
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, socket; port=int(os.getenv('LMCACHE_PORT','6555')); s=socket.create_connection(('127.0.0.1', port), 2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------------------
  # lmcache2: second MP server. `extends` keeps the server topology identical
  # while overriding every host-global resource that must be unique. The two
  # servers intentionally share the coordinator and storage mounts, but use
  # distinct coordinator identities and L2 file prefixes.
  # ---------------------------------------------------------------------------
  lmcache2:
    extends:
      service: lmcache
    container_name: aic-lmcache2
    volumes:
      - ${GDS_SLAB_DATA_2:-/tmp/gds-slab-unused-2}:/data/slab
      - ${LMCACHE_CONFIG_FILE_HOST_2:-/dev/null}:/config/lmcache.yml:ro
      - ${LOG:-../logs}/lmcache2:/var/log/aic-lmcache
    environment:
      - LMCACHE_PORT=${LMCACHE_PORT_2:-6556}
      - LMCACHE_HTTP_PORT=${LMCACHE_HTTP_PORT_2:-8081}
      - LMCACHE_INSTANCE_ID=${LMCACHE_INSTANCE_ID_2:-lmcache-2}
      - LMCACHE_STORAGE_NAMESPACE=${LMCACHE_STORAGE_NAMESPACE_2:-lmcache-2}
      - GDS_SLAB_DATA=${GDS_SLAB_DATA_2:-}
      - LMCACHE_CONFIG_FILE=${LMCACHE_CONFIG_FILE_2:-}
      - NIXL_TELEMETRY_PROMETHEUS_PORT=${NIXL_METRICS_PORT_2:-19091}
      - ROCR_VISIBLE_DEVICES=${GPU2:-1}

  # ---------------------------------------------------------------------------
  # vllm: vLLM serve, optionally with LMCacheMPConnector (via KV_TRANSFER_ARG)
  # ---------------------------------------------------------------------------
  vllm:
    image: ${IMAGE_NAME:-rocm-aic}
    container_name: aic-vllm-gpu${GPU:-0}
    # host net + host IPC + shared PID ns with lmcache: required for cross-container
    # HIP IPC KV registration (see the lmcache service).  kvd arms set
    # VLLM_PID_MODE=service:lmcache so vllm joins lmcache's PID namespace; the plain
    # vram baseline leaves it empty (vllm runs alone, no lmcache to join).
    # vLLM OpenAI API + /metrics on host ${VLLM_PORT:-8000}.
    network_mode: host
    ipc: host
    pid: "${VLLM_PID_MODE:-}"
    cap_add:
      - CAP_SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf
      - ${LOG:-../logs}/vllm:/var/log/aic-vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/hf
      - HF_HUB_CACHE=/hf/hub
      - HF_DATASETS_CACHE=/hf/datasets
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - VLLM_CACHE_ROOT=/hf/vllm
      - VLLM_CONFIG_ROOT=/hf/vllm_config
      - TORCH_HOME=/hf/torch
      - TORCHINDUCTOR_CACHE_DIR=/hf/torch_inductor
      - ROCR_VISIBLE_DEVICES=${GPU:-0}
      - AMDGCN_USE_BUFFER_OPS=0
      - MIOPEN_FIND_MODE=FAST
      - MIOPEN_USER_DB_PATH=/app/miopen
      # AITER unified attention: required so a KV connector (LMCache) can unify a
      # hybrid model's KV-cache specs.  Harmless for the plain baseline.
      - VLLM_ROCM_USE_AITER=${AIC_ROCM_USE_AITER:-1}
      - PYTORCH_ALLOC_CONF=${PYTORCH_ALLOC_CONF:-expandable_segments:False}
      # ROCm/HIP reads PYTORCH_HIP_ALLOC_CONF (PYTORCH_ALLOC_CONF is a no-op here).
      # expandable_segments MUST be off so vLLM's KV tensors can be exported via
      # HIP IPC to the LMCache MP server -- otherwise register_kv_caches fails with
      # "invalid device pointer" (hipErrorInvalidDevicePointer) and the engine hangs.
      - PYTORCH_HIP_ALLOC_CONF=${PYTORCH_HIP_ALLOC_CONF:-expandable_segments:False}
      - PYTHONHASHSEED=0
    command: >
      --model ${VLLM_MODEL:-openai/gpt-oss-120b}
        --host 0.0.0.0
        --port ${VLLM_PORT:-8000}
        --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
        --gpu-memory-utilization ${VLM_GPU_MEMORY_UTILIZATION:-0.90}
        --max-model-len ${VLM_MAX_MODEL_LEN:-32768}
        --max-num-batched-tokens ${VLM_MAX_NUM_BATCHED_TOKENS:-4096}
        --load-format ${VLM_LOAD_FORMAT:-fastsafetensors}
        --block-size 64
        --enable-prefix-caching
        --kv-cache-dtype ${VLM_KV_CACHE_DTYPE:-fp8}
        --attention-backend ${VLM_ATTENTION_BACKEND:-TRITON_ATTN}
        --stream-interval 20
        --async-scheduling
        --disable-access-log-for-endpoints "/health,/metrics,/v1/models"
        --enable-mfu-metrics
        ${KV_TRANSFER_ARG:-}
        ${VLLM_EXTRA_ARGS:-}
    depends_on:
      lmcache:
        condition: service_healthy
        # required:false lets the plain baseline run `vllm` alone (lmcache not in
        # the active profile) without a dependency error (needs Compose v2.20+).
        required: false

  # ---------------------------------------------------------------------------
  # vllm2: second OpenAI endpoint, paired exclusively with lmcache2 over ZMQ
  # and sharing lmcache2's PID namespace for cross-container HIP IPC.
  # ---------------------------------------------------------------------------
  vllm2:
    profiles:
      - cache
    image: ${IMAGE_NAME:-rocm-aic}
    container_name: aic-vllm2-gpu${GPU2:-1}
    network_mode: host
    ipc: host
    pid: "${VLLM_PID_MODE_2:-service:lmcache2}"
    cap_add:
      - CAP_SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf
      - ${LOG:-../logs}/vllm2:/var/log/aic-vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/hf
      - HF_HUB_CACHE=/hf/hub
      - HF_DATASETS_CACHE=/hf/datasets
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - VLLM_CACHE_ROOT=/hf/vllm2
      - VLLM_CONFIG_ROOT=/hf/vllm_config2
      - TORCH_HOME=/hf/torch
      - TORCHINDUCTOR_CACHE_DIR=/hf/torch_inductor2
      - ROCR_VISIBLE_DEVICES=${GPU2:-1}
      - AMDGCN_USE_BUFFER_OPS=0
      - MIOPEN_FIND_MODE=FAST
      - MIOPEN_USER_DB_PATH=/app/miopen
      - VLLM_ROCM_USE_AITER=${AIC_ROCM_USE_AITER:-1}
      - PYTORCH_ALLOC_CONF=${PYTORCH_ALLOC_CONF:-expandable_segments:False}
      - PYTORCH_HIP_ALLOC_CONF=${PYTORCH_HIP_ALLOC_CONF:-expandable_segments:False}
      - PYTHONHASHSEED=0
    command: >
      --model ${VLLM_MODEL:-openai/gpt-oss-120b}
        --host 0.0.0.0
        --port ${VLLM_PORT_2:-8001}
        --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
        --gpu-memory-utilization ${VLM_GPU_MEMORY_UTILIZATION:-0.90}
        --max-model-len ${VLM_MAX_MODEL_LEN:-32768}
        --max-num-batched-tokens ${VLM_MAX_NUM_BATCHED_TOKENS:-4096}
        --load-format ${VLM_LOAD_FORMAT:-fastsafetensors}
        --block-size 64
        --enable-prefix-caching
        --kv-cache-dtype ${VLM_KV_CACHE_DTYPE:-fp8}
        --attention-backend ${VLM_ATTENTION_BACKEND:-TRITON_ATTN}
        --stream-interval 20
        --async-scheduling
        --disable-access-log-for-endpoints "/health,/metrics,/v1/models"
        --enable-mfu-metrics
        ${KV_TRANSFER_ARG_2:-}
