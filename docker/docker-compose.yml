#
# : two-container inference stack (single compose file).
#
#   lmcache — standalone lmcache-server (MP mode)
#               Standard mode (GDS_MODE unset):
#                 L1:  GPU/CPU DRAM (--l1-size-gb)
#                 L2a: nixl_store AIS_MT → local NVMe at NVME_DATA (hipFile P2PDMA)
#                 L2b: nixl_store POSIX  → NFS-over-RDMA (host pre-mounted)
#               GDS L1 mode (GDS_MODE=1):
#                 L1:  NVMe slab at GDS_SLAB_DATA (hipFile on ROCm, cuFile on NVIDIA — auto-detected)
#               local_disk L2 (AIC_L2_BACKEND=local_disk):
#                 L1:  DRAM (--l1-size-gb) + native LocalDiskBackend L2 via LMCACHE_CONFIG_FILE
#
#   vllm    — vllm serve, optionally with LMCacheMPConnector
#               KV_TRANSFER_ARG selects the connector.  Set it to the
#               LMCacheMPConnector JSON (default via `make up`) to connect to the
#               lmcache service over ZMQ, or leave it EMPTY for a plain
#               VRAM-prefix-cache-only vLLM (the cliff `vram` baseline arm).
#
# This one compose file is the single source of truth for every launch path:
#   make up / up-gds-l1                — interactive MP stack
#   .slurm/run-cliff.sbatch            — all cliff arms (vram baseline + nvme + gds)
#   .slurm/run-build-distribute.sh     — tiny-test end-to-end serve
#
# The lmcache service sits behind the `cache` compose profile, so the plain
# `vram` baseline can start `vllm` alone
# (`VLLM_IPC_MODE=shareable docker compose up vllm`) without pulling in lmcache
# — vllm's depends_on uses `required: false` for that.
#
# Required env:
#   ROCM_ARCH      — e.g. gfx942
#   HF_TOKEN       — HuggingFace access token
#   NVME_DATA      — host path to local NVMe mount (L2a AIS_MT pool; e.g. /mnt/lmcache-nvme)
#   NFS_DATA       — host path to NFS-over-RDMA mount (L2b; e.g. /mnt/lmcache-nfs)
#
# Optional:
#   GPU                    — fallback GPU when no SPUR allocation is resolved (default: 0).
#   AIC_ROCR_VISIBLE       — ROCR_VISIBLE_DEVICES for every service to isolate used GPUs
#                            to the ones allocated to use by SPUR.
#   AIC_HIP_VISIBLE        — HIP_VISIBLE_DEVICES + CUDA_VISIBLE_DEVICES.  RELATIVE
#                            indices ( e.g., 0..n-1).
#   GDS_MODE               — set to 1 to enable hipFile NVMe slab as L1 (requires GDS_SLAB_DATA)
#   GDS_SLAB_DATA          — host path for the hipFile slab file (required when GDS_MODE=1)
#   AIC_L2_BACKEND         — nixl (default AIS_MT + POSIX L2), local_disk (native
#                            LocalDiskBackend via LMCACHE_CONFIG_FILE), or none (DRAM-only L1)
#   LMCACHE_CONFIG_FILE_HOST — host path to an LMCache YAML config to mount (advanced; local_disk)
#   KV_TRANSFER_ARG        — vLLM --kv-transfer-config arg (empty = plain vLLM baseline)
#   VLLM_IPC_MODE          — vLLM IPC mode (default: service:lmcache; use shareable
#                            when starting vllm without the lmcache service)
#   AIC_SHM_SIZE           — private /dev/shm capacity (default: 64gb)
#   HF_HOME                — host HF cache dir (default: ~/.cache/huggingface)
#   LOG                    — host log dir (default: ../logs, i.e. /logs)
#   IMAGE_REF              — full image ref name:tag (default: rocm-aic:latest;
#                            `make` sets it to the version-derived tag)
#   IMAGE_NAME             — image name when IMAGE_REF is unset (default: rocm-aic)
#   AIC_VERSION            — AIC release from the root VERSION file
#   ROCM_VERSION           — ROCm release used by the default base image
#   VLLM_VERSION, VLLM_ROCM_VARIANT, LMCACHE_REF, NIXL_REF, HIPFILE_SHA, HSA_SNOOP_REF
#                          — optional framework version build-arg overrides
#   VLLM_MODEL             — model to serve
#   LMCACHE_PORT           — lmcache ZMQ listen port (default: 6555)
#   LMCACHE_L1_SIZE_GB     — L1 cap in GiB (DRAM mode) or slab size (GDS mode, default: 20)
#   LMCACHE_NVME_POOL      — nixl pool slots for NVMe adapter (default: 4096)
#   LMCACHE_NVME_SLOT_SIZE — nixl file size per slot in bytes (default: 256 MiB)
#   LMCACHE_NFS_POOL       — nixl pool slots for NFS adapter (default: 1024)
#   AIC_NIXL_BACKEND             — NIXL plugin for the nixl arm: AIS_MT (default, hipFile P2PDMA) or
#                                  POSIX (first-class POSIX plugin, cpu buffer, no GPUDirect required)
#   AIC_NIXL_USE_DIRECT_IO       — O_DIRECT for the AIS_MT NVMe L2 (default: true). POSIX always uses buffered I/O.
#   LMCACHE_NIXL_POSIX_SLOT_SIZE — slot file size in bytes for the POSIX backend (default: 16 MiB).
#                                  Should match actual KV chunk bytes; smaller than AIS_MT's 256 MiB.
#   LMCACHE_NIXL_POSIX_POOL      — pool slot count for the POSIX backend (default: 32768).
#   LMCACHE_MAX_GPU_WORKERS      — lmcache --max-gpu-workers for parallel STORE/RETRIEVE (default: 1).
#   LMCACHE_COORDINATOR_URL      — base URL the MP server registers/heartbeats against
#                                  (default: http://aic-lmcache-coordinator:9300).
#                                  Unset to disable coordinator registration entirely.
#   LMCACHE_COORDINATOR_PORT     — coordinator HTTP port (default: 9300); /metrics on COORDINATOR_METRICS_PORT (default: 9301).
#   COORDINATOR_METRICS_PORT     — Prometheus /metrics port on the coordinator container (default: 9301).
#   LMCACHE_COORDINATOR_INSTANCE_TIMEOUT — seconds without heartbeat before instance eviction (default: 120).
#   LMCACHE_COORDINATOR_HEALTH_INTERVAL  — seconds between heartbeat-sweep runs (default: 10).
#   LMCACHE_COORDINATOR_EVICTION_INTERVAL — seconds between L2 eviction-check runs (default: 5).
#   LMCACHE_COORDINATOR_KEEPALIVE — uvicorn keep-alive timeout in seconds (default: 65).
#   LMCACHE_CHUNK_SIZE           — tokens per KV chunk; must match MP server and coordinator (default: 256).
#   VLM_GPU_MEMORY_UTILIZATION — vllm --gpu-memory-utilization (default: 0.90)
#   VLM_MAX_MODEL_LEN          — vllm --max-model-len (default: 32768)
#   VLM_MAX_NUM_BATCHED_TOKENS — vllm --max-num-batched-tokens (default: 4096)
#   VLM_BLOCK_SIZE             — vllm --block-size (default: 64)
#   VLM_ATTENTION_BACKEND      — vllm --attention-backend (default: TRITON_ATTN)
#   VLM_KV_CACHE_DTYPE         — vllm --kv-cache-dtype (default: fp8)
#   VLM_KV_CACHE_METRICS_SAMPLE — fraction of KV blocks sampled for residency histograms (default: 0.05)
#   VLLM_EXTRA_ARGS            — extra vllm args appended verbatim (e.g. --hf-overrides ...)
#   TENSOR_PARALLEL_SIZE       — vllm --tensor-parallel-size (default: 1)

networks:
  aic:
    name: aic

services:

  # ---------------------------------------------------------------------------
  # lmcache: standalone LMCache server in MP mode
  # Selects between DRAM L1 + AIS_MT/NFS L2 (default), GDS NVMe slab L1
  # (GDS_MODE=1), and native LocalDiskBackend L2 (AIC_L2_BACKEND=local_disk).
  # Behind the `cache` profile so the plain vram baseline can skip it.
  # ---------------------------------------------------------------------------
  lmcache:
    profiles:
      - cache
    build:
      # Compose lives in docker/; the build context is the  tree
      # root (one level up) so the Dockerfile's COPY scripts/ patches/ benchmarks/
      # monitoring/ paths still resolve.
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        # Use a small tracked directory when no host wheel cache is configured.
        pip-wheels: ${AIC_PIP_WHEELS_DIR:-./constraints}
      args:
        AIC_VERSION:
        ROCM_VERSION:
        ROCM_ARCH: ${ROCM_ARCH}
        BUILD_JOBS: ${BUILD_JOBS:-}
        AIC_UCX_FAST: ${AIC_UCX_FAST:-}
        VLLM_VERSION:
        VLLM_ROCM_VARIANT:
        LMCACHE_REF:
        MOONCAKE_REF:
        MOONCAKE_FETCH_REF:
        NIXL_REF:
        HIPFILE_SHA:
        HSA_SNOOP_REF:
    image: ${IMAGE_REF:-${IMAGE_NAME:-rocm-aic}:latest}
    container_name: aic-lmcache
    # Cross-container HIP IPC (LMCacheMPConnector registering vLLM's KV tensors) on
    # ROCm requires the two containers to share IPC + a PID namespace.  lmcache owns
    # shareable IPC and its default PID namespace here; the vllm service JOINS both
    # via `ipc: service:lmcache` and `pid: service:lmcache` (see below).
    # Host PID makes `docker rm` hang on teardown; container-shared does not.
    # IPC namespace sharing is independent of network_mode — the aic bridge network
    # provides DNS-based service discovery for prometheus without affecting IPC.
    # Ports reachable within the aic network: lmcache HTTP API 8080, NIXL telemetry 19090.
    networks: [aic]
    ipc: shareable
    shm_size: "${AIC_SHM_SIZE:-64gb}"
    cap_add:
      - CAP_SYS_ADMIN
      - SYS_PTRACE
      - IPC_LOCK
    security_opt:
      - seccomp:unconfined
    ulimits:
      # NIXL opens one FD per pool slot at init; keep above pool sizes.
      nofile:
        soft: 1048576
        hard: 1048576
      # hipFileBufRegister pins the registered staging buffer; needs unlimited memlock.
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      # L2a NVMe — AIS_MT pool files (standard mode)
      - ${NVME_DATA:-/mnt/lmcache-nvme}:/data/nvme
      # L2b NFS — POSIX pool files (standard mode)
      - ${NFS_DATA:-/mnt/lmcache-nfs}:/data/nfs
      # GDS L1 slab (GDS_MODE=1 only; mount is harmless when GDS_MODE is unset)
      - ${GDS_SLAB_DATA:-/tmp/gds-slab-unused}:/data/slab
      # Optional LMCache YAML config (local_disk / advanced tuning).  Defaults to a
      # harmless mount; only read when LMCACHE_CONFIG_FILE is set in the environment.
      - ${LMCACHE_CONFIG_FILE_HOST:-/dev/null}:/config/lmcache.yml:ro
      # Kernel interfaces for hipFile KFD GPUDirect fastpath (GDS L1 mode)
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /boot:/boot:ro
      - ${LOG:-../logs}/lmcache:/var/log/aic-lmcache
    environment:
      - LMCACHE_PORT=${LMCACHE_PORT:-6555}
      - LMCACHE_L1_SIZE_GB=${LMCACHE_L1_SIZE_GB:-20}
      - GDS_MODE=${GDS_MODE:-}
      - GDS_SLAB_DATA=${GDS_SLAB_DATA:-}
      - AIC_L2_BACKEND=${AIC_L2_BACKEND:-nixl}
      - LMCACHE_NVME_POOL=${LMCACHE_NVME_POOL:-4096}
      - LMCACHE_NVME_SLOT_SIZE=${LMCACHE_NVME_SLOT_SIZE:-268435456}
      - LMCACHE_NFS_POOL=${LMCACHE_NFS_POOL:-1024}
      - AIC_NIXL_USE_DIRECT_IO=${AIC_NIXL_USE_DIRECT_IO:-true}
      - AIC_NIXL_BACKEND=${AIC_NIXL_BACKEND:-AIS_MT}
      - LMCACHE_NIXL_POSIX_SLOT_SIZE=${LMCACHE_NIXL_POSIX_SLOT_SIZE:-16777216}
      - LMCACHE_NIXL_POSIX_POOL=${LMCACHE_NIXL_POSIX_POOL:-32768}
      - LMCACHE_MAX_GPU_WORKERS=${LMCACHE_MAX_GPU_WORKERS:-1}
      - LMCACHE_L2_PREFETCH_MAX_IN_FLIGHT=${LMCACHE_L2_PREFETCH_MAX_IN_FLIGHT:-4}
      # Coordinator registration: the MP server registers, heartbeats, and
      # deregisters against the coordinator so it can track which blocks are held.
      # Unset LMCACHE_COORDINATOR_URL to run without coordinator (standalone mode).
      - LMCACHE_COORDINATOR_URL=${LMCACHE_COORDINATOR_URL:-http://aic-lmcache-coordinator:9300}
      # Only set when a real config file is mounted (local_disk / advanced tuning).
      - LMCACHE_CONFIG_FILE=${LMCACHE_CONFIG_FILE:-}
      - HIPFILE_ALLOW_COMPAT_MODE=false
      # Keep hipFile's storage validation enabled. Bypassing it can issue direct
      # I/O against unsupported layouts and risks data corruption.
      - HIPFILE_UNSUPPORTED_FILE_SYSTEMS=false

      # NIXL native Prometheus telemetry exporter (serves /metrics on :19090).
      # Requires the prometheus-cpp plugin compiled into the image (build-nixl.sh);
      # a no-op fallback if absent.  Set NIXL_TELEMETRY_ENABLE= to disable.
      - NIXL_TELEMETRY_ENABLE=${NIXL_TELEMETRY_ENABLE-y}
      - NIXL_TELEMETRY_EXPORTER=${NIXL_TELEMETRY_EXPORTER:-prometheus}
      - NIXL_TELEMETRY_PROMETHEUS_PORT=${NIXL_METRICS_PORT:-19090}
      # Must share the SAME GPU as the vllm service: LMCacheMPConnector registers
      # vLLM's KV tensors via CUDA IPC, which fails ("invalid device pointer") if
      # lmcache lands on a different device.  Mirror vllm's ROCR_VISIBLE_DEVICES.
      #
      - ROCR_VISIBLE_DEVICES=${AIC_ROCR_VISIBLE:-${GPU:-0}}
      - HIP_VISIBLE_DEVICES=${AIC_HIP_VISIBLE:-0}
      - CUDA_VISIBLE_DEVICES=${AIC_HIP_VISIBLE:-0}
      - PYTHONHASHSEED=0
      - TZ=${TZ:-America/Edmonton}
    # The entrypoint script selects the L1/L2 topology from GDS_MODE +
    # AIC_L2_BACKEND.  local_disk relies on LMCACHE_CONFIG_FILE (mounted above).
    entrypoint: ["/bin/bash", "-o", "pipefail", "-c"]
    command:
      - |
        # Build coordinator flags once; empty when LMCACHE_COORDINATOR_URL is unset.
        _COORD_FLAGS=""
        if [ -n "$${LMCACHE_COORDINATOR_URL:-}" ]; then
          _COORD_FLAGS="--coordinator-url $$LMCACHE_COORDINATOR_URL --coordinator-event-reporting"
        fi
        if [ "${GDS_MODE:-0}" = "1" ]; then
          exec lmcache server \
            --no-separate-object-groups \
            --host 0.0.0.0 \
            --http-port 8080 \
            --port "$$LMCACHE_PORT" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --max-gpu-workers "$${LMCACHE_MAX_GPU_WORKERS:-1}" \
            --worker-reap-timeout-seconds "$${LMCACHE_WORKER_REAP_TIMEOUT:-3600}" \
            --gds-l1-path /data/slab \
            $$_COORD_FLAGS
        elif [ "$$AIC_L2_BACKEND" = "local_disk" ] || [ "$$AIC_L2_BACKEND" = "none" ]; then
          # DRAM L1 only on the CLI.  local_disk adds a native LocalDiskBackend L2
          # via the mounted LMCACHE_CONFIG_FILE; none = pure DRAM (the minimal MP
          # config -- used by tiny-test and DRAM-only deployments).
          exec lmcache server \
            --no-separate-object-groups \
            --host 0.0.0.0 \
            --http-port 8080 \
            --port "$$LMCACHE_PORT" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --max-gpu-workers "$${LMCACHE_MAX_GPU_WORKERS:-1}" \
            --worker-reap-timeout-seconds "$${LMCACHE_WORKER_REAP_TIMEOUT:-3600}" \
            $$_COORD_FLAGS
        elif [ "$${AIC_NIXL_BACKEND:-AIS_MT}" = "POSIX" ] || [ "$$AIC_L2_BACKEND" = "nixl_posix" ]; then
          # NIXL first-class POSIX plugin (cpu staging buffer, no hipFileBufRegister).
          # Use for nodes where GPUDirect P2PDMA is unavailable (e.g. XFS LVM).
          # No NFS L2b — single POSIX NVMe L2 with buffered I/O.
          # Uses LMCACHE_NIXL_POSIX_SLOT_SIZE (16 MiB default) rather than the
          # AIS_MT 256 MiB staging-buffer size: POSIX writes actual KV bytes per slot.
          exec lmcache server \
            --host 0.0.0.0 \
            --http-port 8080 \
            --port "$$LMCACHE_PORT" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --max-gpu-workers "$${LMCACHE_MAX_GPU_WORKERS:-1}" \
            --l2-prefetch-max-in-flight "$${LMCACHE_L2_PREFETCH_MAX_IN_FLIGHT:-4}" \
            --worker-reap-timeout-seconds "$${LMCACHE_WORKER_REAP_TIMEOUT:-3600}" \
            --l2-adapter "{\"type\":\"nixl_store\",\"backend\":\"POSIX\",\"backend_params\":{\"file_path\":\"/data/nvme/lmcache\",\"use_direct_io\":\"false\",\"file_size\":\"$$LMCACHE_NIXL_POSIX_SLOT_SIZE\"},\"pool_size\":$$LMCACHE_NIXL_POSIX_POOL}" \
            $$_COORD_FLAGS
        else
          # nixl AIS_MT NVMe L2a + POSIX NFS L2b.  Both are file-based nixl_store
          # backends, so both backend_params MUST include use_direct_io (LMCache
          # rejects the adapter otherwise); POSIX/NFS uses buffered I/O (false).
          exec lmcache server \
            --no-separate-object-groups \
            --host 0.0.0.0 \
            --http-port 8080 \
            --port "$$LMCACHE_PORT" \
            --l1-size-gb "$$LMCACHE_L1_SIZE_GB" \
            --eviction-policy LRU \
            --max-gpu-workers "$${LMCACHE_MAX_GPU_WORKERS:-1}" \
            --worker-reap-timeout-seconds "$${LMCACHE_WORKER_REAP_TIMEOUT:-3600}" \
            --l2-adapter "{\"type\":\"nixl_store\",\"backend\":\"AIS_MT\",\"backend_params\":{\"file_path\":\"/data/nvme/lmcache\",\"use_direct_io\":\"$$AIC_NIXL_USE_DIRECT_IO\",\"file_size\":\"$$LMCACHE_NVME_SLOT_SIZE\"},\"pool_size\":$$LMCACHE_NVME_POOL}" \
            --l2-adapter "{\"type\":\"nixl_store\",\"backend\":\"POSIX\",\"backend_params\":{\"file_path\":\"/data/nfs/lmcache\",\"use_direct_io\":\"false\"},\"pool_size\":$$LMCACHE_NFS_POOL}" \
            $$_COORD_FLAGS
        fi
    depends_on:
      lmcache-coordinator:
        condition: service_healthy
        # required:false so standalone runs (LMCACHE_COORDINATOR_URL unset) don't
        # block if the coordinator is somehow skipped from the active profile.
        required: false
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, socket; port=int(os.getenv('LMCACHE_PORT','6555')); s=socket.create_connection(('127.0.0.1', port), 2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------------------
  # lmcache-coordinator: LMCache MP coordinator + Prometheus exporter in one
  # container.  Uses the same rocm-aic image as lmcache (lmcache's dep tree
  # cannot be split from the GPU wheels at import time) but runs no GPU
  # workloads — no devices, no mounts, no IPC namespace needed.
  # REST API on :9300; /metrics (Prometheus) on :9301.
  # Behind the `cache` profile alongside lmcache.
  # ---------------------------------------------------------------------------
  lmcache-coordinator:
    profiles:
      - cache
    image: ${IMAGE_REF:-${IMAGE_NAME:-rocm-aic}:latest}
    container_name: aic-lmcache-coordinator
    networks: [aic]
    restart: unless-stopped
    environment:
      - LMCACHE_DISABLE_BANNER=1
      - LMCACHE_COORDINATOR_PORT=${LMCACHE_COORDINATOR_PORT:-9300}
      - COORDINATOR_METRICS_PORT=${COORDINATOR_METRICS_PORT:-9301}
      - LMCACHE_COORDINATOR_INSTANCE_TIMEOUT=${LMCACHE_COORDINATOR_INSTANCE_TIMEOUT:-120}
      - LMCACHE_COORDINATOR_HEALTH_INTERVAL=${LMCACHE_COORDINATOR_HEALTH_INTERVAL:-10}
      - LMCACHE_COORDINATOR_EVICTION_INTERVAL=${LMCACHE_COORDINATOR_EVICTION_INTERVAL:-5}
      - LMCACHE_COORDINATOR_KEEPALIVE=${LMCACHE_COORDINATOR_KEEPALIVE:-65}
      - LMCACHE_CHUNK_SIZE=${LMCACHE_CHUNK_SIZE:-256}
      - TZ=${TZ:-America/Edmonton}
    volumes:
      - ../monitoring/scripts/lmcache_coordinator_entrypoint.py:/app/entrypoint.py:ro
    entrypoint: ["python3", "/app/entrypoint.py"]
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LMCACHE_COORDINATOR_PORT:-9300}/healthz', timeout=2)\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # vllm: vLLM serve, optionally with LMCacheMPConnector (via KV_TRANSFER_ARG)
  # ---------------------------------------------------------------------------
  vllm:
    image: ${IMAGE_REF:-${IMAGE_NAME:-rocm-aic}:latest}
    container_name: aic-vllm-gpu${GPU:-0}
    # Shared IPC/PID namespaces with lmcache: required for cross-container HIP IPC
    # KV registration (see the lmcache service).  vllm joins lmcache's shareable IPC
    # namespace by default; cache-backed launch paths also set VLLM_PID_MODE=service:lmcache
    # so it joins lmcache's PID namespace.  Set VLLM_IPC_MODE=shareable when starting
    # vllm alone for the plain baseline.
    # vLLM OpenAI API + /metrics reachable within the aic network on port 8000.
    networks: [aic]
    ipc: "${VLLM_IPC_MODE:-service:lmcache}"
    # Applied when vllm owns its IPC namespace; ignored when it joins lmcache.
    shm_size: "${AIC_SHM_SIZE:-64gb}"
    pid: "${VLLM_PID_MODE:-}"
    cap_add:
      - CAP_SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf
      - ${LOG:-../logs}/vllm:/var/log/aic-vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/hf
      - HF_HUB_CACHE=/hf/hub
      - HF_DATASETS_CACHE=/hf/datasets
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - VLLM_CACHE_ROOT=/hf/vllm
      - VLLM_CONFIG_ROOT=/hf/vllm_config
      - TORCH_HOME=/hf/torch
      - TORCHINDUCTOR_CACHE_DIR=/hf/torch_inductor
      - VLLM_TARGET_DEVICE=rocm
      - ROCR_VISIBLE_DEVICES=${AIC_ROCR_VISIBLE:-${GPU:-0}}
      - HIP_VISIBLE_DEVICES=${AIC_HIP_VISIBLE:-0}
      - CUDA_VISIBLE_DEVICES=${AIC_HIP_VISIBLE:-0}
      - AMDGCN_USE_BUFFER_OPS=0
      - MIOPEN_FIND_MODE=FAST
      - MIOPEN_USER_DB_PATH=/app/miopen
      # AITER unified attention: required so a KV connector (LMCache) can unify a
      # hybrid model's KV-cache specs.  Harmless for the plain baseline.
      - VLLM_ROCM_USE_AITER=${AIC_ROCM_USE_AITER:-1}
      - PYTORCH_ALLOC_CONF=${PYTORCH_ALLOC_CONF:-expandable_segments:False}
      # ROCm/HIP reads PYTORCH_HIP_ALLOC_CONF (PYTORCH_ALLOC_CONF is a no-op here).
      # expandable_segments MUST be off so vLLM's KV tensors can be exported via
      # HIP IPC to the LMCache MP server -- otherwise register_kv_caches fails with
      # "invalid device pointer" (hipErrorInvalidDevicePointer) and the engine hangs.
      - PYTORCH_HIP_ALLOC_CONF=${PYTORCH_HIP_ALLOC_CONF:-expandable_segments:False}
      - PYTHONHASHSEED=0
      - TZ=${TZ:-America/Edmonton}
      # Set to DEBUG to enable "vLLM hit is: N" log lines in the connector
      # (lmcache_mp_connector.py:798) — useful for diagnosing ext_hit=0.
      # Set to WARNING to suppress chatty INFO request logs.
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      # Enable vLLM dev endpoints: POST /reset_prefix_cache, /reset_mm_cache, etc.
      # Required to flush the GPU-side prefix cache via API without restarting vLLM.
      - VLLM_SERVER_DEV_MODE=${VLLM_SERVER_DEV_MODE:-1}
    command: >
      --model ${VLLM_MODEL:-openai/gpt-oss-120b}
        --host 0.0.0.0
        --port 8000
        --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
        --gpu-memory-utilization ${VLM_GPU_MEMORY_UTILIZATION:-0.90}
        --max-model-len ${VLM_MAX_MODEL_LEN:-32768}
        --max-num-batched-tokens ${VLM_MAX_NUM_BATCHED_TOKENS:-4096}
        --load-format ${VLM_LOAD_FORMAT:-fastsafetensors}
        --block-size ${VLM_BLOCK_SIZE:-64}
        --enable-prefix-caching
        --kv-cache-dtype ${VLM_KV_CACHE_DTYPE:-fp8}
        --attention-backend ${VLM_ATTENTION_BACKEND:-TRITON_ATTN}
        --stream-interval 20
        --async-scheduling
        --disable-access-log-for-endpoints "/health,/metrics,/v1/models,/v1/chat/completions,/v1/completions,/reset_prefix_cache"
        --enable-mfu-metrics
        --kv-cache-metrics
        --kv-cache-metrics-sample ${VLM_KV_CACHE_METRICS_SAMPLE:-0.05}
        ${KV_TRANSFER_ARG:-}
        ${VLLM_EXTRA_ARGS:-}
    depends_on:
      lmcache:
        condition: service_healthy
        # required:false lets the plain baseline run `vllm` alone (lmcache not in
        # the active profile) without a dependency error (needs Compose v2.20+).
        required: false

  # ---------------------------------------------------------------------------
  # client: Python + curl container on the aic network for ad-hoc testing and
  # benchmarking.  The repo root is bind-mounted at /repo so run_cliff.py and
  # other benchmarks are available without rebuilding the image.
  # Use `docker exec -it aic-client bash` to get a shell, then hit
  # vllm/lmcache by container name (e.g. http://aic-vllm-gpu0:8000).
  # pip deps are pre-installed from an explicit list matching pyproject.toml [dev] at startup.
  # ---------------------------------------------------------------------------
  client:
    image: ${AIC_CLIENT_IMAGE:-python:3.12}
    container_name: aic-client
    networks: [aic]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install --quiet \
          openai httpx pyyaml tqdm \
          transformers huggingface-hub \
          prometheus-client aiohttp \
          matplotlib pandas numpy && \
        tail -f /dev/null
    volumes:
      - ..:/repo:ro
      - ../logs:/logs
    working_dir: /repo
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # prometheus: scrapes all stack targets by container name via the aic network.
  # Behind the `monitoring` profile — start with `make up-monitoring` or
  # `docker compose --profile cache --profile monitoring up`.
  # TSDB written to AIC_METRICS_DIR (default: ../logs/prometheus).
  # PROM_UID/PROM_GID must be set so prometheus can write the TSDB dir;
  # `make up-monitoring` sets them automatically to the current user.
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: [monitoring]
    image: ${AIC_PROM_IMAGE:-prom/prometheus:v3.13.2}
    container_name: aic-prometheus
    networks: [aic]
    extra_hosts:
      - "host-gateway:host-gateway"
    user: "${PROM_UID:-65534}:${PROM_GID:-65534}"
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ${AIC_METRICS_DIR:-../logs/prometheus}:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${AIC_PROM_RETENTION:-90d}
      - --web.enable-lifecycle
      - --web.listen-address=:${AIC_PROM_PORT:-9090}

  # ---------------------------------------------------------------------------
  # node-exporter: host CPU/mem/disk/net/NVMe/RDMA metrics on :9100.
  # Behind the `monitoring` profile.  Uses pid:host for accurate per-process
  # CPU stats; mounts the host rootfs read-only via /host.
  # ---------------------------------------------------------------------------
  node-exporter:
    profiles: [monitoring]
    image: ${AIC_NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.12.1}
    container_name: aic-node-exporter
    networks: [aic]
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --collector.diskstats
      - --collector.nvme
      - --collector.infiniband
      - --web.listen-address=:9100

  # ---------------------------------------------------------------------------
  # amdgpu-exporter: AMD device-metrics-exporter, gpu_* metrics on :5000.
  # Behind the `monitoring` profile.
  # ---------------------------------------------------------------------------
  amdgpu-exporter:
    profiles: [monitoring]
    image: ${AIC_AMDGPU_EXPORTER_IMAGE:-rocm/device-metrics-exporter:v1.5.1}
    container_name: aic-amdgpu-exporter
    networks: [aic]
    restart: unless-stopped
    environment:
      - ROCR_VISIBLE_DEVICES=${AIC_ROCR_VISIBLE:-${GPU:-0}}
      - HIP_VISIBLE_DEVICES=${AIC_HIP_VISIBLE:-0}
      - CUDA_VISIBLE_DEVICES=${AIC_HIP_VISIBLE:-0}
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - /sys:/sys:ro
      - ../monitoring/amdgpu-exporter/config.json:/etc/metrics/config.json:ro

  # ---------------------------------------------------------------------------
  # nvme-exporter: NVMe Prometheus exporter on :9998.
  # Behind the `monitoring` profile.  Requires a pre-built image:
  #   make monitoring-build-exporters
  # CAP_SYS_ADMIN + /dev bind-mount for nvme-cli ioctl; no host networking needed.
  # ---------------------------------------------------------------------------
  nvme-exporter:
    profiles: [monitoring]
    image: ${AIC_NVME_EXPORTER_IMAGE:-aic-nvme-exporter:local}
    container_name: aic-nvme-exporter
    networks: [aic]
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - /sys:/sys:ro

  # ---------------------------------------------------------------------------
  # rdma-exporter: RDMA/RoCE sysfs Prometheus exporter on :9879.
  # Behind the `monitoring` profile.  Requires a pre-built image:
  #   make monitoring-build-exporters
  # Reads RDMA stats from sysfs only; no host networking or extra caps needed.
  # ---------------------------------------------------------------------------
  rdma-exporter:
    profiles: [monitoring]
    image: ${AIC_RDMA_EXPORTER_IMAGE:-aic-rdma-exporter:local}
    container_name: aic-rdma-exporter
    networks: [aic]
    restart: unless-stopped
    volumes:
      - /sys:/sys:ro
    command:
      - --listen-address=:9879
      - --metrics-path=/metrics
      - --health-path=/health
      - --enable-roce-pfc-metrics=false

  # ---------------------------------------------------------------------------
  # grafana: pre-provisioned AIC dashboard, anonymous access, port 3000.
  # Open http://localhost:3000 after `make up` (with --profile monitoring).
  # ---------------------------------------------------------------------------
  grafana:
    profiles: [monitoring]
    image: ${AIC_GRAFANA_IMAGE:-grafana/grafana:13.1.3}
    container_name: aic-grafana
    networks: [aic]
    ports:
      - "${AIC_GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:

  # hsa-snoop is intentionally omitted here: it requires exclusive access to
  # /sys/kernel/tracing/trace_pipe and conflicts with any host hsa-snoop service.
  # If no host hsa-snoop is running, launch it via the monitoring compose:
  #   docker compose -f monitoring/docker-compose.monitoring.yml --profile exporters up -d hsa-snoop
