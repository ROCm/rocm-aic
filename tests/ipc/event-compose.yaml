# Two-container HIP IPC event micro-benchmark.
#
# Producer owns a shareable IPC namespace; consumer joins it (same as the aic
# vllm<->lmcache setup). Both get the GPU and a shared /ipc volume for the
# handle hand-off. Toggle HSA_ENABLE_IPC_MODE_LEGACY to compare modes:
#
#   # non-LEGACY:
#   AIC_IMG=aic-vllm:latest RENDER_GID=$(getent group render | cut -d: -f3) \
#     docker compose -f tests/ipc/event-compose.yaml up --abort-on-container-exit
#   # LEGACY:
#   HSA_ENABLE_IPC_MODE_LEGACY=1 AIC_IMG=aic-vllm:latest RENDER_GID=... \
#     docker compose -f tests/ipc/event-compose.yaml up --abort-on-container-exit
services:
  producer:
    image: ${AIC_IMG:-aic-vllm:latest}
    entrypoint: ["python3", "/tests/event_producer.py"]
    ipc: shareable
    environment:
      HSA_ENABLE_IPC_MODE_LEGACY: "${HSA_ENABLE_IPC_MODE_LEGACY:-}"
      HIP_VISIBLE_DEVICES: "0"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID:-993}"
    volumes:
      - ./ipc-vol:/ipc
      - .:/tests:ro

  consumer:
    image: ${AIC_IMG:-aic-vllm:latest}
    entrypoint: ["python3", "/tests/event_consumer.py"]
    ipc: "service:producer"
    depends_on:
      - producer
    environment:
      HSA_ENABLE_IPC_MODE_LEGACY: "${HSA_ENABLE_IPC_MODE_LEGACY:-}"
      HIP_VISIBLE_DEVICES: "0"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID:-993}"
    volumes:
      - ./ipc-vol:/ipc
      - .:/tests:ro
